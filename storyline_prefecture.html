          moment.locations.forEach(function (location) {
            if (!location || !location.sessions) return;
            location.sessions.forEach(function (sid) {
              var sess = ds.sessions[sid];
              if (!sess || !sess.members || sess.members.length === 0) return;
              var members = sess.members.filter(function (cid) {
                return rank[cid] !== undefined;
              }).sort(function (a, b) {
                return rank[a] - rank[b];
              });
              if (members.length === 0) return;
              members.forEach(function (cid) { used[cid] = true; });
              blocks.push({
                key: "s" + sid,
                sid: sid,
                members: members,
                rank: d3.min(members, function (cid) { return rank[cid]; })
              });
            });
          });
        }

        moment.sortedCharacters.forEach(function (cid) {
          if (used[cid]) return;
          blocks.push({ key: "c" + cid, sid: -1, members: [cid], rank: rank[cid] });
        });

        blocks.sort(function (a, b) {
          if (a.rank !== b.rank) return a.rank - b.rank;
          return a.key < b.key ? -1 : 1;
        });
        return blocks;
      }

      function flattenBlocks(blocks) {
        var out = [];
        blocks.forEach(function (block) {
          block.members.forEach(function (cid) {
            if (out.indexOf(cid) === -1) out.push(cid);
          });
        });
        return out;
      }

      function orderDistance(a, b) {
        if (!a || !b || a.length < 2 || b.length < 2) return 0;
        return kendallDistance(a, b).discordant;
      }

      function localOrderScore(ds, timeIndex, order) {
        var smoothWeight = (options.algorithm && typeof options.algorithm.globalOrderSmoothWeight === "number")
          ? options.algorithm.globalOrderSmoothWeight
          : 0.65;
        var score = 0;
        var prev = timeIndex > 0 ? ds.d3.time[timeIndex - 1].sortedCharacters : null;
        var next = timeIndex < ds.d3.time.length - 1 ? ds.d3.time[timeIndex + 1].sortedCharacters : null;

        if (prev) score += orderDistance(prev, order) * (1 + smoothWeight);
        if (next) score += orderDistance(order, next) * (1 + smoothWeight);

        var base = ds.d3.time[timeIndex].d3 && ds.d3.time[timeIndex].d3.baseOrder;
        if (base) score += orderDistance(base, order) * 0.08;
        return score;
      }

      function optimizeGlobalBlockOrdering(ds) {
        if (!ds || !ds.d3 || !ds.d3.time) return;
        var passes = (options.algorithm && typeof options.algorithm.globalOrderOptimizePasses === "number")
          ? options.algorithm.globalOrderOptimizePasses
          : 0;
        if (passes <= 0) return;

        for (var pass = 0; pass < passes; pass++) {
          var changed = false;
          var start = pass % 2 === 0 ? 0 : ds.d3.time.length - 1;
          var end = pass % 2 === 0 ? ds.d3.time.length : -1;
          var step = pass % 2 === 0 ? 1 : -1;

          for (var t = start; t !== end; t += step) {
            var moment = ds.d3.time[t];
            if (!moment || !moment.sortedCharacters || moment.sortedCharacters.length < 2) continue;
            var blocks = getOrderedBlocksForMoment(ds, moment);
            if (blocks.length < 2) continue;

            var improved = true;
            while (improved) {
              improved = false;
              for (var i = 0; i < blocks.length - 1; i++) {
                var currentOrder = flattenBlocks(blocks);
                var currentScore = localOrderScore(ds, t, currentOrder);
                var candidate = blocks.slice();
                var tmp = candidate[i];
                candidate[i] = candidate[i + 1];
                candidate[i + 1] = tmp;
                var candidateOrder = flattenBlocks(candidate);
                var candidateScore = localOrderScore(ds, t, candidateOrder);

                if (candidateScore + 1e-9 < currentScore) {
                  blocks = candidate;
                  moment.sortedCharacters = candidateOrder;
                  rebuildMomentLocationsFromTree(moment);
                  changed = true;
                  improved = true;
                }
              }
            }
          }

          if (!changed) break;
        }
      }

      optimizeGlobalBlockOrdering(bestDataset);

      // ============================================================
      // 5.3 Alignment (paper exact): session alignment (weighted LCS)
      //   + line alignment inside matched sessions (entity LCS)
      // Produces: dataset.d3.time[t].d3.alignment = {
      //   sessionPairs: [{ sidL, sidR, score, alignedEntities:[cid...]}...],
      //   alignedSegments: [{cid, t0, t1, sidL, sidR}...]
      // }
      // ============================================================

      function buildSessionSequence(moment) {
        // Top-to-bottom session sequence S = {s1..sk}
        // We use moment.locations order + location.sessions order.
        // For each session, build ordered entity list by filtering moment.sortedCharacters.
        var seq = [];
        if (!moment || !moment.locations) return seq;

        // Build quick membership map per session
        for (var li = 0; li < moment.locations.length; li++) {
          var loc = moment.locations[li];
          if (!loc || !loc.sessions) continue;

          for (var si = 0; si < loc.sessions.length; si++) {
            var sid = loc.sessions[si];
            var sess = dataset.sessions[sid];
            if (!sess) continue;

            var mem = {};
            for (var k = 0; k < sess.members.length; k++) mem[sess.members[k]] = true;

            // entity order = moment.sortedCharacters filtered by members
            var ordered = [];
            for (var p = 0; p < moment.sortedCharacters.length; p++) {
              var cid = moment.sortedCharacters[p];
              if (mem[cid]) ordered.push(cid);
            }

            seq.push({
              sid: sid,
              membersOrdered: ordered
            });
          }
        }
        return seq;
      }

      // Standard LCS (returns matched element values, not just length)
      function lcsMatchedElements(a, b) {
        var m = a.length, n = b.length;
        var dp = new Array(m + 1);
        var dir = new Array(m + 1); // 0 diag, 1 up, 2 left
        for (var i = 0; i <= m; i++) {
          dp[i] = new Array(n + 1).fill(0);
          dir[i] = new Array(n + 1).fill(0);
        }

        for (var i2 = 1; i2 <= m; i2++) {
          for (var j2 = 1; j2 <= n; j2++) {
            if (a[i2 - 1] === b[j2 - 1]) {
              var vDiag = dp[i2 - 1][j2 - 1] + 1;
              var vUp = dp[i2 - 1][j2];
              var vLeft = dp[i2][j2 - 1];
              var best = vDiag;
              var d = 0;
              if (vUp > best) { best = vUp; d = 1; }
              if (vLeft > best) { best = vLeft; d = 2; }

              // tie-break: prefer diag (more “straight”), then up, then left
              if (vDiag === best) d = 0;
              else if (vUp === best) d = 1;
              else d = 2;

              dp[i2][j2] = best;
              dir[i2][j2] = d;
            } else {
              var up = dp[i2 - 1][j2];
              var left = dp[i2][j2 - 1];
              if (up > left) {
                dp[i2][j2] = up;
                dir[i2][j2] = 1;
              } else if (left > up) {
                dp[i2][j2] = left;
                dir[i2][j2] = 2;
              } else {
                // tie-break: prefer up (stable)
                dp[i2][j2] = up;
                dir[i2][j2] = 1;
              }
            }
          }
        }

        // traceback
        var out = [];
        var i3 = m, j3 = n;
        while (i3 > 0 && j3 > 0) {
          var d2 = dir[i3][j3];
          if (d2 === 0 && a[i3 - 1] === b[j3 - 1]) {
            out.push(a[i3 - 1]);
            i3--; j3--;
          } else if (d2 === 1) {
            i3--;
          } else {
            j3--;
          }
        }
        out.reverse();
        return out;
      }

      function straightCount(sessionL, sessionR) {
        // Paper: straight(li, rj) = max number of straight segments obtainable from li and rj.
        // With fixed ordering, this equals LCS length between ordered entity lists.
        // Extension: a straight segment for a line that stays at the same location
        // counts (1 + continuityWeight), so on ties the session a line stays in
        // wins the alignment over one it is merely arriving at, and the line that
        // stays put is the one kept straight. continuityWeight = 0 is the paper's Eq.
        var n = lcsMatchedElements(sessionL.membersOrdered, sessionR.membersOrdered).length;
        var sameLocation = dataset.sessions[sessionL.sid].location === dataset.sessions[sessionR.sid].location;
        var beta = (options.algorithm && typeof options.algorithm.continuityWeight === "number") ? options.algorithm.continuityWeight : 1;
        return sameLocation ? n * (1 + beta) : n;
      }

      function sessionSim(i1based, j1based, m, n, sessionL, sessionR, alpha) {
        // Paper Eq.(3): sim(li,rj) = straight(li,rj) + α * (1 - | i/m - j/n | )
        var st = straightCount(sessionL, sessionR);
        var posTerm = 1.0 - Math.abs((i1based / m) - (j1based / n));
        return st + alpha * posTerm;
      }

      function alignSessionsWeightedLCS(seqL, seqR, alpha) {
        // Paper Eq.(4) + DP recurrence (weighted LCS)
        var m = seqL.length, n = seqR.length;
        var dp = new Array(m + 1);
        var dir = new Array(m + 1); // 0 diag, 1 up, 2 left
        for (var i = 0; i <= m; i++) {
          dp[i] = new Array(n + 1).fill(0);
          dir[i] = new Array(n + 1).fill(0);
        }

        for (var i2 = 1; i2 <= m; i2++) {
          for (var j2 = 1; j2 <= n; j2++) {
            var sim = sessionSim(i2, j2, m, n, seqL[i2 - 1], seqR[j2 - 1], alpha);

            var vDiag = dp[i2 - 1][j2 - 1] + sim;
            var vUp = dp[i2 - 1][j2];
            var vLeft = dp[i2][j2 - 1];

            var best = vUp;
            var d = 1;

            if (vLeft > best) { best = vLeft; d = 2; }
            if (vDiag > best) { best = vDiag; d = 0; }

            // tie-break (important for stability):
            // prefer diag (more alignment), then up, then left
            if (vDiag === best) d = 0;
            else if (vUp === best) d = 1;
            else d = 2;

            dp[i2][j2] = best;
            dir[i2][j2] = d;
          }
        }

        // traceback to get matched session pairs in order
        var pairs = [];
        var i3 = m, j3 = n;
        while (i3 > 0 && j3 > 0) {
          var d2 = dir[i3][j3];
          if (d2 === 0) {
            // matched (i3-1, j3-1)
            pairs.push({ i: i3 - 1, j: j3 - 1, score: dp[i3][j3] - dp[i3 - 1][j3 - 1] });
            i3--; j3--;
          } else if (d2 === 1) {
            i3--;
          } else {
            j3--;
          }
        }
        pairs.reverse();
        return { score: dp[m][n], pairs: pairs };
      }

      function computeAlignmentForAllFrames(ds, options) {
        var alpha = (options.algorithm && typeof options.algorithm.alpha === "number")
          ? options.algorithm.alpha
          : 0.1; // paper default

        for (var t = 0; t < ds.d3.time.length - 1; t++) {
          var L = ds.d3.time[t];
          var R = ds.d3.time[t + 1];
          if (!L || !R) continue;

          var SL = buildSessionSequence(L);
          var SR = buildSessionSequence(R);

          var res = alignSessionsWeightedLCS(SL, SR, alpha);

          var sessionPairs = [];
          var alignedSegments = [];

          for (var p = 0; p < res.pairs.length; p++) {
            var pr = res.pairs[p];
            var sL = SL[pr.i];
            var sR = SR[pr.j];

            // line alignment inside matched session pair:
            // aligned entity segments = LCS elements between ordered member lists
            var alignedEntities = lcsMatchedElements(sL.membersOrdered, sR.membersOrdered);

            sessionPairs.push({
              sidL: sL.sid,
              sidR: sR.sid,
              score: sessionSim(pr.i + 1, pr.j + 1, SL.length, SR.length, sL, sR, alpha),
              alignedEntities: alignedEntities
            });

            // produce ↔ constraints candidates (Si,t ↔ Si,t+1) for aligned entities
            for (var k = 0; k < alignedEntities.length; k++) {
              alignedSegments.push({
                cid: alignedEntities[k],
                t0: t,
                t1: t + 1,
                sidL: sL.sid,
                sidR: sR.sid
              });
            }
          }

          if (!L.d3) L.d3 = {};
          L.d3.alignment = {
            alpha: alpha,
            dpScore: res.score,
            sessionPairs: sessionPairs,
            alignedSegments: alignedSegments
          };
        }
      }

      // Member order inside a session block never changes crossings with other
      // blocks, so lines joining a bundle can be stacked in the order they
      // arrive from (a line coming from below takes the bottom slot instead of
      // crossing the others), and lines about to leave in the order they leave
      // to. Forward pass: at each frame, order each bundle's members by the
      // previous frame; backward pass: by the next frame. The new order is
      // applied to every frame the same members stay bundled together, so it
      // never creates a swap inside a bundle, and it's kept only if crossings
      // over that span strictly drop (swaps between lines bundled in both
      // frames weigh 10, as they read as lines running over each other).
      function reorderWithinSessions(ds) {
        var times = ds.d3.time, T = times.length;
        var before = countCrossingsAll(ds);
        var sids = times.map(function (m) {
          var sidOf = {};
          m.locations.forEach(function (loc) {
            loc.sessions.forEach(function (sid) {
              ds.sessions[sid].members.forEach(function (cid) { sidOf[cid] = sid; });
            });
          });
          return sidOf;
        });
        function bundleSwaps(a, sa, b, sb) {
          var ids = a.filter(function (c) { return b.indexOf(c) !== -1; }), n = 0;
          for (var i = 0; i < ids.length; i++) {
            for (var j = i + 1; j < ids.length; j++) {
              var u = ids[i], v = ids[j];
              if (sa[u] !== sa[v] || sb[u] !== sb[v]) continue;
              if ((a.indexOf(u) < a.indexOf(v)) !== (b.indexOf(u) < b.indexOf(v))) n++;
            }
          }
          return n;
        }
        function spanCost(lo, hi) {
          var c = 0;
          for (var t = Math.max(0, lo); t < Math.min(T - 1, hi); t++) {
            var a = times[t].sortedCharacters, b = times[t + 1].sortedCharacters;
            c += computeCrossings(computeRealizationMatrix(a, b), a, b) + 10 * bundleSwaps(a, sids[t], b, sids[t + 1]);
          }
          return c;
        }
        function tryFrame(t, refT, dir) {
          var cur = times[t].sortedCharacters, ref = times[refT].sortedCharacters;
          var groups = {};
          cur.forEach(function (c) {
            if (ref.indexOf(c) !== -1) (groups[sids[t][c]] = groups[sids[t][c]] || []).push(c);
          });
          Object.keys(groups).forEach(function (g) {
            var subset = groups[g];
            if (subset.length < 2) return;
            var desired = subset.slice().sort(function (a, b) { return ref.indexOf(a) - ref.indexOf(b); });
            if (desired.join() === subset.join()) return;
            var frames = [];
            for (var k = t; k >= 0 && k < T; k += dir) {
              var order = times[k].sortedCharacters;
              var together = subset.every(function (c) {
                return order.indexOf(c) !== -1 && sids[k][c] === sids[k][subset[0]];
              });
              if (!together) break;
              frames.push(k);
            }
            var lo = Math.min(t, frames[frames.length - 1]) - 1, hi = Math.max(t, frames[frames.length - 1]) + 1;
            var costBefore = spanCost(lo, hi);
            var saved = frames.map(function (k) { return times[k].sortedCharacters; });
            frames.forEach(function (k) {
              var order = times[k].sortedCharacters.slice();
              var slots = subset.map(function (c) { return order.indexOf(c); }).sort(function (a, b) { return a - b; });
              slots.forEach(function (slot, i) { order[slot] = desired[i]; });
              times[k].sortedCharacters = order;
            });
            if (spanCost(lo, hi) >= costBefore) {
              frames.forEach(function (k, i) { times[k].sortedCharacters = saved[i]; });
            }
          });
        }
        var saved = times.map(function (m) { return m.sortedCharacters.slice(); });
        for (var t = 1; t < T; t++) tryFrame(t, t - 1, 1);
        for (t = T - 2; t >= 0; t--) tryFrame(t, t + 1, -1);
        if (countCrossingsAll(ds) > before) {
          times.forEach(function (m, t) { m.sortedCharacters = saved[t]; });
        }
        console.log("[cross] within-session reorder:", before, "->", countCrossingsAll(ds));
      }
      reorderWithinSessions(bestDataset);

      // After sweeping, compute alignment on the bestDataset (not the transient dataset)
      computeAlignmentForAllFrames(bestDataset, options);

      // ============================================================
      // 5.4 Compaction (QP) via ADMM: minimize wiggle + whitespace
      // s.t. (5a) order, (5b) alignment eq, (5c) din eq, (5d) dout ineq
      // Output: bestDataset.d3.time[t].d3.y[cid] (absolute y)
      // ============================================================

      // ---- sparse builder (CSC-like but we use dense ops eventually) ----
      function makeVarIndexer(nChars, nTimes) {
        return {
          nChars: nChars,
          nTimes: nTimes,
          nVar: nChars * nTimes,
          idx: function (cid, t) { return cid * nTimes + t; }
        };
      }

      function zeros(n) { return new Float64Array(n); }

      function dotRowAx(rowCols, rowVals, x) {
        var s = 0;
        for (var k = 0; k < rowCols.length; k++) s += rowVals[k] * x[rowCols[k]];
        return s;
      }

      // Build session blocks at time t: each block is ordered member list (top->bottom)
      function getSessionBlocksAtTime(ds, moment) {
        var blocks = [];
        if (!moment || !moment.locations) return blocks;

        // 1) multi-member session blocks (>=2)
        var inAnyBlock = {}; // cid -> true

        for (var li = 0; li < moment.locations.length; li++) {
          var loc = moment.locations[li];
          if (!loc || !loc.sessions) continue;

          for (var si = 0; si < loc.sessions.length; si++) {
            var sid = loc.sessions[si];
            var sess = ds.sessions[sid];
            if (!sess || !sess.members) continue;

            // build ordered members by current vertical order
            var mem = {};
            for (var k = 0; k < sess.members.length; k++) mem[sess.members[k]] = true;

            var ordered = [];
            for (var p = 0; p < moment.sortedCharacters.length; p++) {
              var cid = moment.sortedCharacters[p];
              if (mem[cid]) ordered.push(cid);
            }

            if (ordered.length >= 2) {
              blocks.push({ sid: sid, members: ordered });
              for (var z = 0; z < ordered.length; z++) inAnyBlock[ordered[z]] = true;
            }
          }
        }

        // 2) singleton blocks for isolated characters (not in any >=2 session)
        // This is crucial to keep dout constraints alive and avoid collapse.
        if (moment.sortedCharacters) {
          for (var i = 0; i < moment.sortedCharacters.length; i++) {
            var cid2 = moment.sortedCharacters[i];
            if (!inAnyBlock[cid2]) {
              blocks.push({ sid: -1, members: [cid2] }); // sid=-1 means "isolated"
            }
          }
        }

        return blocks;
      }

      // Build objective: 0.5 x^T Q x + q^T x
      // wiggle: sum (y(i,t+1)-y(i,t))^2
      // white : lambda * sum_{session-boundary} ((y_lo - y_up) - dout)^2
      function buildObjective(ds, varIx, lambdaWhite, dout, wiggleWeight, sessionStabilityWeight) {
        var n = varIx.nVar;

        // dense symmetric Q
        var Q = new Array(n);
        for (var i = 0; i < n; i++) Q[i] = new Float64Array(n);

        // linear term q
        var q = new Float64Array(n);

        function addQuadDiff(a, b, w) {
          // contributes w*(xa-xb)^2 to objective
          // objective is 0.5 x^T Q x + q^T x
          Q[a][a] += 2 * w;
          Q[b][b] += 2 * w;
          Q[a][b] += -2 * w;
          Q[b][a] += -2 * w;
        }

        function addBoundarySlackSquared(a, b, w, d) {
          // w*((xa-xb)-d)^2 = w*(xa-xb)^2 - 2*w*d*(xa-xb) + const
          // quadratic part:
          addQuadDiff(a, b, w);

          // linear part: -2*w*d*xa + 2*w*d*xb
          q[a] += -2 * w * d;
          q[b] += +2 * w * d;
        }

        var nChars = varIx.nChars, nTimes = varIx.nTimes;
        var wWiggle = (typeof wiggleWeight === "number") ? wiggleWeight : 1.0;

        // (1) wiggle
        for (var cid = 0; cid < nChars; cid++) {
          for (var t = 0; t < nTimes - 1; t++) {
            addQuadDiff(varIx.idx(cid, t), varIx.idx(cid, t + 1), wWiggle);
          }
        }

        // (1b) session stability: extra penalty, on top of the baseline wiggle
        // above, for a character's frame-to-frame movement while it stays in
        // the SAME shared (>=2 member) session block. The plain wiggle term
        // treats every character equally, so when a dout/order constraint
        // elsewhere in the diagram forces some movement, the solver is free
        // to let it fall on a same-session pair if that happens to be
        // cheaper system-wide — even though nothing about that pair's own
        // membership changed. This term makes that specifically expensive,
        // so the QP prefers absorbing unrelated changes elsewhere instead of
        // drifting an already-stable session block.
        var wSessionStability = (typeof sessionStabilityWeight === "number") ? sessionStabilityWeight : 0;
        if (wSessionStability > 0) {
          for (var ts = 0; ts < nTimes - 1; ts++) {
            var momentA = ds.d3.time[ts], momentB = ds.d3.time[ts + 1];
            if (!momentA || !momentB) continue;
            var blocksA = getSessionBlocksAtTime(ds, momentA);
            var blocksB = getSessionBlocksAtTime(ds, momentB);
            var sidOfA = {}, sidOfB = {};
            for (var bi2 = 0; bi2 < blocksA.length; bi2++) {
              if (blocksA[bi2].sid === -1) continue;
              var msA = blocksA[bi2].members;
              for (var ii2 = 0; ii2 < msA.length; ii2++) sidOfA[msA[ii2]] = blocksA[bi2].sid;
            }
            for (var bj2 = 0; bj2 < blocksB.length; bj2++) {
              if (blocksB[bj2].sid === -1) continue;
              var msB = blocksB[bj2].members;
              for (var jj2 = 0; jj2 < msB.length; jj2++) sidOfB[msB[jj2]] = blocksB[bj2].sid;
            }
            for (var cidKey in sidOfA) {
              if (sidOfB[cidKey] !== undefined && sidOfB[cidKey] === sidOfA[cidKey]) {
                addQuadDiff(varIx.idx(+cidKey, ts), varIx.idx(+cidKey, ts + 1), wSessionStability);
              }
            }
          }
        }

        // (2) white space: ONLY session boundaries (different blocks) at each time
        for (var t2 = 0; t2 < nTimes; t2++) {
          var moment = ds.d3.time[t2];
          if (!moment || !moment.sortedCharacters || moment.sortedCharacters.length < 2) continue;

          // build blocks and char->block
          var blocks = getSessionBlocksAtTime(ds, moment);
          var charToBlock = {};
          for (var bi = 0; bi < blocks.length; bi++) {
            var ms = blocks[bi].members;
            for (var ii = 0; ii < ms.length; ii++) charToBlock[ms[ii]] = bi;
          }

          var ord = moment.sortedCharacters;

          // boundary = adjacent pair in global order that belongs to different session blocks
          for (var k = 0; k < ord.length - 1; k++) {
            var up = ord[k], lo = ord[k + 1];
            var bu = charToBlock[up], bl = charToBlock[lo];
            if (bu === undefined || bl === undefined) continue;
            if (bu === bl) continue; // within-session spacing is handled by din equality constraints

            // add ((y_lo - y_up) - dout)^2
            addBoundarySlackSquared(
              varIx.idx(lo, t2),
              varIx.idx(up, t2),
              lambdaWhite,
              dout
            );
          }
        }

        return { Q: Q, q: q };
      }

      // Build linear constraints in row form:
      // each row is (cols[], vals[]), with bounds l,u
      function buildConstraintsRows(ds, varIx, din, dout, epsOrder) {
        var rows = [];
        var l = [];
        var u = [];
        var INF = 1e30;

        function addRow(cols, vals, lo, up) {
          rows.push({ cols: cols, vals: vals });
          l.push(lo);
          u.push(up);
        }

        var nTimes = varIx.nTimes;

        // (5a) order: y(lower,t) - y(upper,t) >= epsOrder
        for (var t = 0; t < nTimes; t++) {
          var order = ds.d3.time[t].sortedCharacters;
          if (!order || order.length < 2) continue;
          for (var k = 0; k < order.length - 1; k++) {
            var upper = order[k], lower = order[k + 1];
            addRow(
              [varIx.idx(lower, t), varIx.idx(upper, t)],
              [1, -1],
              epsOrder,
              INF
            );
          }
        }

      // (5b) alignment: y(cid,t+1) - y(cid,t) = 0
      for (var t2 = 0; t2 < nTimes - 1; t2++) {
        var al = ds.d3.time[t2].d3 && ds.d3.time[t2].d3.alignment;
        if (!al || !al.alignedSegments) continue;
          var segs = al.alignedSegments;
          for (var s = 0; s < segs.length; s++) {
            var cid = segs[s].cid;
            addRow(
              [varIx.idx(cid, t2 + 1), varIx.idx(cid, t2)],
              [1, -1],
              0,
              0
            );
          }
        }

        // (5c) din in-session: y(next,t) - y(prev,t) = din
        // (5d) dout between sessions: y(lower,t)-y(upper,t) >= dout on boundaries
        for (var t3 = 0; t3 < nTimes; t3++) {
          var moment = ds.d3.time[t3];
          if (!moment) continue;

          var blocks = getSessionBlocksAtTime(ds, moment);

          // din within each block
          for (var b = 0; b < blocks.length; b++) {
            var mems = blocks[b].members;
            for (var kk = 0; kk < mems.length - 1; kk++) {
              var a = mems[kk], b2 = mems[kk + 1];
              addRow(
                [varIx.idx(b2, t3), varIx.idx(a, t3)],
                [1, -1],
                din,
                din
              );
            }
          }

          // dout at boundaries: detect neighbors in global order belonging to different blocks
          var charToBlock = {};
          for (var bi = 0; bi < blocks.length; bi++) {
            var ms = blocks[bi].members;
            for (var ii = 0; ii < ms.length; ii++) charToBlock[ms[ii]] = bi;
          }

          var ord = moment.sortedCharacters;
          if (!ord) continue;

          for (var k3 = 0; k3 < ord.length - 1; k3++) {
            var up = ord[k3], lo = ord[k3 + 1];
            var bu = charToBlock[up], bl = charToBlock[lo];
            if (bu === undefined || bl === undefined) continue;
            if (bu === bl) continue; // already din
            addRow(
              [varIx.idx(lo, t3), varIx.idx(up, t3)],
              [1, -1],
              dout,
              INF
            );
          }
        }

        return { rows: rows, l: new Float64Array(l), u: new Float64Array(u) };
      }

      // Feasible initialization:
      // build y by scanning global order at each time using din/dout; then average across time, then enforce alignment by copy.
      function buildInitialFeasible(ds, varIx, din, dout, epsOrder) {
        var nVar = varIx.nVar;
        var x = new Float64Array(nVar);
        var nTimes = varIx.nTimes;

        for (var t = 0; t < nTimes; t++) {
          var moment = ds.d3.time[t];
          var ord = moment.sortedCharacters || [];
          if (ord.length === 0) continue;

          // boundary gaps decided by whether adjacent are in same session block or not
          var blocks = getSessionBlocksAtTime(ds, moment);
          var charToBlock = {};
          for (var bi = 0; bi < blocks.length; bi++) {
            var ms = blocks[bi].members;
            for (var ii = 0; ii < ms.length; ii++) charToBlock[ms[ii]] = bi;
          }

          var y = 0;
          x[varIx.idx(ord[0], t)] = y;

          for (var k = 0; k < ord.length - 1; k++) {
            var a = ord[k], b = ord[k + 1];
            var ba = charToBlock[a], bb = charToBlock[b];

            var step = din;
            if (ba === undefined || bb === undefined) step = din; // isolated lines treated like inside
            else if (ba !== bb) step = Math.max(dout, epsOrder);  // ensure order too

            y += step;
            x[varIx.idx(b, t)] = y;
          }
        }

        // enforce alignment equalities in init: for each aligned segment, copy y forward
        for (var t2 = 0; t2 < nTimes - 1; t2++) {
          var al = ds.d3.time[t2].d3 && ds.d3.time[t2].d3.alignment;
          if (!al || !al.alignedSegments) continue;
          var segs = al.alignedSegments;
          for (var s = 0; s < segs.length; s++) {
            var cid = segs[s].cid;
            x[varIx.idx(cid, t2 + 1)] = x[varIx.idx(cid, t2)];
          }
        }

        return x;
      }

      // ADMM solver for convex QP:
      // minimize 0.5 x^T Q x  s.t. l <= A x <= u
      // We implement:
      // x^{k+1} = argmin 0.5 x^T Q x + (rho/2)||A x - z + y||^2
      // z^{k+1} = proj_{[l,u]}(A x^{k+1} + y^k)
      // y^{k+1} = y^k + A x^{k+1} - z^{k+1}
      function solveQP_ADMM(Q, q, cons, x0, rho, sigma, maxIter, epsAbs, epsRel) {
        var rows = cons.rows, l = cons.l, u = cons.u;
        var m = rows.length;
        var n = x0.length;

        // Build dense AtA and At vectors once (m,n small enough in your scale)
        // For speed, pre-store rows as arrays
        var z = new Float64Array(m);
        var y = new Float64Array(m);

        // helper: Ax
        function Ax(x, out) {
          for (var i = 0; i < m; i++) {
            out[i] = dotRowAx(rows[i].cols, rows[i].vals, x);
          }
        }

        // Build matrix M = Q + rho A^T A + sigma I (dense), then factor each time with Cholesky-like (we'll do LDLT)
        // Compute AtA (dense)
        var AtA = new Array(n);
        for (var i = 0; i < n; i++) AtA[i] = new Float64Array(n);

        for (var r = 0; r < m; r++) {
          var cols = rows[r].cols, vals = rows[r].vals;
          for (var a = 0; a < cols.length; a++) {
            var ia = cols[a], va = vals[a];
            for (var b = 0; b < cols.length; b++) {
              var ib = cols[b], vb = vals[b];
              AtA[ia][ib] += va * vb;
            }
          }
        }

        var M = new Array(n);
        for (var i2 = 0; i2 < n; i2++) {
          M[i2] = new Float64Array(n);
          for (var j2 = 0; j2 < n; j2++) {
            M[i2][j2] = Q[i2][j2] + rho * AtA[i2][j2];
          }
          M[i2][i2] += sigma;
        }

        // M is the SAME matrix on every ADMM iteration (only the right-hand
        // side changes), so factor it once with partial-pivot Gaussian
        // elimination and reuse the factors instead of re-eliminating a
        // fresh dense n x n system from scratch on every one of the up-to-
        // maxIter iterations (this was previously an O(n^3) cost per
        // iteration instead of O(n^2), and dominated render time for
        // datasets with more than a handful of characters/time frames).
        function factorizeLinear(M) {
          var A = new Array(n);
          for (var i = 0; i < n; i++) {
            A[i] = new Float64Array(n);
            A[i].set(M[i]);
          }
          var piv = new Int32Array(n);
          for (var i0 = 0; i0 < n; i0++) piv[i0] = i0;
          var mult = new Array(n);
          for (var k0 = 0; k0 < n; k0++) mult[k0] = new Float64Array(n);

          for (var k = 0; k < n; k++) {
            var pivRow = k;
            var best = Math.abs(A[k][k]);
            for (var i = k + 1; i < n; i++) {
              var v = Math.abs(A[i][k]);
              if (v > best) { best = v; pivRow = i; }
            }
            if (pivRow !== k) {
              var tmp = A[k]; A[k] = A[pivRow]; A[pivRow] = tmp;
              var tmpM = mult[k]; mult[k] = mult[pivRow]; mult[pivRow] = tmpM;
              var tp = piv[k]; piv[k] = piv[pivRow]; piv[pivRow] = tp;
            }
            var akk = A[k][k];
            if (Math.abs(akk) < 1e-12) akk = (akk >= 0 ? 1e-12 : -1e-12);

            for (var i = k + 1; i < n; i++) {
              var f = A[i][k] / akk;
              mult[i][k] = f;
              if (f === 0) continue;
              for (var j = k; j < n; j++) A[i][j] -= f * A[k][j];
            }
          }
          return { U: A, mult: mult, piv: piv };
        }

        function solveWithFactors(factors, b) {
          var U = factors.U, mult = factors.mult, piv = factors.piv;
          var x = new Float64Array(n);
          for (var i = 0; i < n; i++) x[i] = b[piv[i]];
          for (var k = 0; k < n; k++) {
            for (var i = k + 1; i < n; i++) {
              var f = mult[i][k];
              if (f !== 0) x[i] -= f * x[k];
            }
          }
          for (var i2 = n - 1; i2 >= 0; i2--) {
            var s = x[i2];
            for (var j = i2 + 1; j < n; j++) s -= U[i2][j] * x[j];
            var aii = U[i2][i2];
            if (Math.abs(aii) < 1e-12) aii = (aii >= 0 ? 1e-12 : -1e-12);
            x[i2] = s / aii;
          }
          return x;
        }

        var mFactors = factorizeLinear(M);
        function solveLinear(M, b) {
          return solveWithFactors(mFactors, b);
        }

        var x = new Float64Array(x0);
        var ax = new Float64Array(m);
        Ax(x, ax);

        // init z = proj(Ax)
        for (var i3 = 0; i3 < m; i3++) {
          var v = ax[i3];
          if (v < l[i3]) v = l[i3];
          if (v > u[i3]) v = u[i3];
          z[i3] = v;
          y[i3] = 0;
        }

        var rhs = new Float64Array(n);
        var tmpAx = new Float64Array(m);

        for (var it = 0; it < maxIter; it++) {
          // rhs = rho A^T (z - y) - q
          rhs.fill(0);
          for (var r2 = 0; r2 < m; r2++) {
            var w = rho * (z[r2] - y[r2]);
            var cols2 = rows[r2].cols, vals2 = rows[r2].vals;
            for (var kk2 = 0; kk2 < cols2.length; kk2++) {
              rhs[cols2[kk2]] += vals2[kk2] * w;
            }
          }
          // subtract linear term
          if (q) {
            for (var iqq = 0; iqq < n; iqq++) rhs[iqq] -= q[iqq];
          }

          // Solve (Q + rho A^T A + sigma I) x = rhs
          x = solveLinear(M, rhs);

          // Ax
          Ax(x, tmpAx);

          // z = proj_{[l,u]}(Ax + y)
          var primalInf = 0;
          var dualInf = 0;
          for (var r3 = 0; r3 < m; r3++) {
            var v2 = tmpAx[r3] + y[r3];
            var zOld = z[r3];
            if (v2 < l[r3]) v2 = l[r3];
            if (v2 > u[r3]) v2 = u[r3];
            z[r3] = v2;

            var rPri = tmpAx[r3] - z[r3];
            primalInf = Math.max(primalInf, Math.abs(rPri));

            var rDual = rho * (z[r3] - zOld);
            dualInf = Math.max(dualInf, Math.abs(rDual));
          }

          // y update
          for (var r4 = 0; r4 < m; r4++) {
            y[r4] += (tmpAx[r4] - z[r4]);
          }

          // stopping
          var epsPri = epsAbs + epsRel * Math.max(normInf(tmpAx), normInf(z));
          var epsDual = epsAbs + epsRel * normInf(y);

          if (primalInf <= epsPri && dualInf <= epsDual) {
            // console.log("[QP] converged it=", it, "pri=", primalInf, "dual=", dualInf);
            break;
          }
        }

        return x;

        function normInf(v) {
          var mx = 0;
          for (var i = 0; i < v.length; i++) mx = Math.max(mx, Math.abs(v[i]));
          return mx;
        }
      }

      function solveQP_OSQP(Q, q, cons, rho, sigma, maxIter, epsAbs, epsRel) {
        if (!osqpModule) return null;

        var rows = cons.rows, l = cons.l, u = cons.u;
        var m = rows.length;
        var n = q.length;

        function denseToUpperCsc(mat, tol) {
          var p = new Int32Array(n + 1);
          var iList = [];
          var xList = [];
          var nnz = 0;

          for (var col = 0; col < n; col++) {
            p[col] = nnz;
            for (var row = 0; row <= col; row++) {
              var v = mat[row][col];
              if (Math.abs(v) > tol) {
                iList.push(row);
                xList.push(v);
                nnz++;
              }
            }
          }
          p[n] = nnz;
          return { p: p, i: new Int32Array(iList), x: new Float64Array(xList), nnz: nnz };
        }

        function rowsToCsc(rowsIn, nCols) {
          var counts = new Int32Array(nCols);
          for (var r = 0; r < rowsIn.length; r++) {
            var cols = rowsIn[r].cols;
            for (var k = 0; k < cols.length; k++) counts[cols[k]]++;
          }

          var p = new Int32Array(nCols + 1);
          var nnz2 = 0;
          for (var c = 0; c < nCols; c++) {
            p[c] = nnz2;
            nnz2 += counts[c];
          }
          p[nCols] = nnz2;

          var iArr = new Int32Array(nnz2);
          var xArr = new Float64Array(nnz2);
          var next = new Int32Array(p);

          for (var r2 = 0; r2 < rowsIn.length; r2++) {
            var cols2 = rowsIn[r2].cols;
            var vals2 = rowsIn[r2].vals;
            for (var k2 = 0; k2 < cols2.length; k2++) {
              var col = cols2[k2];
              var dest = next[col]++;
              iArr[dest] = r2;
              xArr[dest] = vals2[k2];
            }
          }

          return { p: p, i: iArr, x: xArr, nnz: nnz2 };
        }

        var P = denseToUpperCsc(Q, 1e-12);
        var A = rowsToCsc(rows, n);

        var solve = osqpModule.cwrap("osqp_solve_csc", "number",
          ["number", "number",
           "number", "number", "number", "number",
           "number", "number", "number", "number",
           "number", "number", "number",
           "number", "number", "number", "number", "number", "number"]);

        if (!osqpModule._malloc || !osqpModule._free || !osqpModule.setValue) {
          console.warn("OSQP module missing memory helpers");
          return null;
        }

        function mallocAndCopyInt(arr) {
          var ptr = osqpModule._malloc(arr.length * 4);
          for (var idx = 0; idx < arr.length; idx++) {
            osqpModule.setValue(ptr + idx * 4, arr[idx], "i32");
          }
          return ptr;
        }

        function mallocAndCopyDouble(arr) {
          var ptr = osqpModule._malloc(arr.length * 8);
          for (var idx2 = 0; idx2 < arr.length; idx2++) {
            osqpModule.setValue(ptr + idx2 * 8, arr[idx2], "double");
          }
          return ptr;
        }

        var P_p = mallocAndCopyInt(P.p);
        var P_i = mallocAndCopyInt(P.i);
        var P_x = mallocAndCopyDouble(P.x);
        var A_p = mallocAndCopyInt(A.p);
        var A_i = mallocAndCopyInt(A.i);
        var A_x = mallocAndCopyDouble(A.x);
        var qPtr = mallocAndCopyDouble(q);
        var lPtr = mallocAndCopyDouble(l);
        var uPtr = mallocAndCopyDouble(u);
        var xOut = osqpModule._malloc(n * 8);

        var status = solve(
          n, m,
          P.nnz, P_p, P_i, P_x,
          A.nnz, A_p, A_i, A_x,
          qPtr, lPtr, uPtr,
          epsAbs, epsRel, maxIter, rho, sigma,
          xOut
        );

        var x = new Float64Array(n);
        for (var xi = 0; xi < n; xi++) {
          x[xi] = osqpModule.getValue(xOut + xi * 8, "double");
        }

        osqpModule._free(P_p);
        osqpModule._free(P_i);
        osqpModule._free(P_x);
        osqpModule._free(A_p);
        osqpModule._free(A_i);
        osqpModule._free(A_x);
        osqpModule._free(qPtr);
        osqpModule._free(lPtr);
        osqpModule._free(uPtr);
        osqpModule._free(xOut);

        if (status !== 1 && status !== 2) {
          console.warn("OSQP status:", status, "(fallback to ADMM)");
          x = null;
        }

        return x;
      }

      function runCompactionQP(ds, options) {
        var nChars = ds.characters.length;
        var nTimes = ds.d3.time.length;
        var varIx = makeVarIndexer(nChars, nTimes);

        var din = options.algorithm.din;
        var dout = options.algorithm.dout;
        var epsOrder = options.algorithm.epsOrder || 1.0;
        var lambdaWhite = options.algorithm.lambdaWhite || 0.2;

        var rho = options.algorithm.rho || 2.0;
        var sigma = options.algorithm.sigma || 1e-6;
        var maxIter = options.algorithm.maxIterQP || 4000;
        var epsAbs = options.algorithm.epsAbs || 1e-6;
        var epsRel = options.algorithm.epsRel || 1e-6;

        var wiggleWeight = options.algorithm.wiggleWeight || 1.0;
        var sessionStabilityWeight = (typeof options.algorithm.sessionStabilityWeight === "number")
          ? options.algorithm.sessionStabilityWeight
          : 0;
        var obj = buildObjective(ds, varIx, lambdaWhite, dout, wiggleWeight, sessionStabilityWeight);
        var Q = obj.Q;
        var q = obj.q;

        var cons = buildConstraintsRows(ds, varIx, din, dout, epsOrder);

        var x0 = buildInitialFeasible(ds, varIx, din, dout, epsOrder);
        var x = null;

        if (options.algorithm.useOSQP && osqpModule) {
          x = solveQP_OSQP(Q, q, cons, rho, sigma, maxIter, epsAbs, epsRel);
        }
        if (!x) {
          x = solveQP_ADMM(Q, q, cons, x0, rho, sigma, maxIter, epsAbs, epsRel);
        }

        // store y back
        for (var t = 0; t < nTimes; t++) {
          var moment = ds.d3.time[t];
          if (!moment.d3) moment.d3 = {};
          moment.d3.y = new Array(nChars);
          for (var cid = 0; cid < nChars; cid++) {
            moment.d3.y[cid] = x[varIx.idx(cid, t)];
          }
        }

      }
      // ---- debug: alignment constraint volume ----
      (function () {
        var totalPairs = 0, totalSegs = 0;
        var maxSegs = 0, maxT = -1;

        for (var t = 0; t < bestDataset.d3.time.length - 1; t++) {
          var al = bestDataset.d3.time[t].d3 && bestDataset.d3.time[t].d3.alignment;
          if (!al) continue;

          var np = (al.sessionPairs ? al.sessionPairs.length : 0);
          var ns = (al.alignedSegments ? al.alignedSegments.length : 0);

          totalPairs += np;
          totalSegs += ns;

          if (ns > maxSegs) { maxSegs = ns; maxT = t; }

          console.log("[align] t=", t, "sessionPairs=", np, "alignedSegments=", ns, "dpScore=", al.dpScore);
        }

        console.log("[align] totalPairs=", totalPairs, "totalAlignedSegments=", totalSegs,
          "maxAlignedSegments=", maxSegs, "at t=", maxT);
      })();
      // ---- /debug ----

      function countCrossingsAll(ds) {
        var total = 0;
        for (var t = 0; t < ds.d3.time.length - 1; t++) {
          var a = ds.d3.time[t].sortedCharacters;
          var b = ds.d3.time[t + 1].sortedCharacters;
          var m = computeRealizationMatrix(a, b);
          total += computeCrossings(m, a, b);
        }
        return total;
      }

      function computeDatasetMetrics(ds) {
        var crossingsTotal = countCrossingsAll(ds);
        var crossingsAvg = 0;
        var kendallSum = 0;
        var kendallCount = 0;
        var kendallDiscordant = 0;
        var kendallPairs = 0;
        var crossingsSeries = [];
        var kendallSeries = [];

        for (var t = 0; t < ds.d3.time.length - 1; t++) {
          var a = ds.d3.time[t].sortedCharacters;
          var b = ds.d3.time[t + 1].sortedCharacters;
          if (!a || !b) continue;
          var m = computeRealizationMatrix(a, b);
          var c = computeCrossings(m, a, b);
          var kd = kendallDistance(a, b);
          crossingsSeries.push(c);
          kendallSeries.push(kd.normalized);
          kendallSum += kd.normalized;
          kendallCount += 1;
          kendallDiscordant += kd.discordant;
          kendallPairs += kd.totalPairs;
        }

        if (ds.d3.time.length > 1) {
          crossingsAvg = crossingsTotal / (ds.d3.time.length - 1);
        }

        var kendallAvg = kendallCount ? (kendallSum / kendallCount) : 0;
        var kendallOverall = kendallPairs ? (kendallDiscordant / kendallPairs) : 0;

        ds.d3.metrics = {
          crossingsTotal: crossingsTotal,
          crossingsAvg: crossingsAvg,
          kendallAvg: kendallAvg,
          kendallOverall: kendallOverall,
          series: {
            crossings: crossingsSeries,
            kendall: kendallSeries
          }
        };
      }

      console.log("[cross] before QP =", countCrossingsAll(bestDataset));
      runCompactionQP(bestDataset, options);
      console.log("[cross] after  QP =", countCrossingsAll(bestDataset));

      computeDatasetMetrics(bestDataset);
      return bestDataset;
    }
  </script>
