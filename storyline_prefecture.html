  <script type="text/javascript">
    var DATASET = { path: "dataset/bungo_prefecture.json", name: "日本近現代文学史: 都道府県粒度" };
    var osqpModule = null;
    var osqpModulePromise = null;

    // Storyline curve: monotone cubic (Steffen's method, same as d3 v4
    // curveMonotoneX). Control points sit at 1/3 of their own segment, so no
    // hooks or overshoot.
    function storylineTangents(p) {
      var m = [];
      for (var i = 0; i < p.length; i++) {
        var h0 = i > 0 ? p[i][0] - p[i - 1][0] : 0;
        var h1 = i < p.length - 1 ? p[i + 1][0] - p[i][0] : 0;
        if (Math.abs(h0) < 1e-9 || Math.abs(h1) < 1e-9) { m.push(0); continue; }
        var s0 = (p[i][1] - p[i - 1][1]) / h0, s1 = (p[i + 1][1] - p[i][1]) / h1;
        var q = (s0 * h1 + s1 * h0) / (h0 + h1);
        m.push((Math.sign(s0) + Math.sign(s1)) * Math.min(Math.abs(s0), Math.abs(s1), 0.5 * Math.abs(q)) || 0);
      }
      return m;
    }

    function storylineCurve(points) {
      var m = storylineTangents(points);
      var path = [points[0][0], ",", points[0][1]];
      for (var i = 1; i < points.length; i++) {
        var x0 = points[i - 1][0], y0 = points[i - 1][1], x1 = points[i][0], y1 = points[i][1], h = (x1 - x0) / 3;
        path.push("C", x0 + h, ",", y0 + h * m[i - 1], " ", x1 - h, ",", y1 - h * m[i], " ", x1, ",", y1);
      }
      return path.join("");
    }

    function storylineArrays(points) {
      return points.slice().sort(function (a, b) { return a.x - b.x; })
        .map(function (d) { return [d.x, d.y, d.sid, d.loc, d.lead, d.tail]; });
    }

    // Character lines: the QP polyline is split into runs of consecutive frames
    // in the same shared session (p[i][2] = session id, -1 when alone). Two
    // sessions at the same location (p[i][3]) are one run when the move between
    // them is small: that's a bundle re-centring as someone joins or leaves,
    // and squeezing it into one narrow frame gap would show as a bump. Each run
    // is convolved with a Gaussian in x, holding its end values, so small moves
    // in narrow gaps spread out instead of showing as steps. The filter is
    // linear, so bundle members (constant offsets) stay parallel. Real moves
    // happen only in the gap after a run's last frame, as a monotone cubic
    // Hermite matched to both runs' slopes (C1, no kink, no overshoot), so a
    // line never bends away while still in a band.
    var storylineSigma = 16; // px; larger = smoother, less faithful to frames
    var storylineMergeDy = 24; // px; same-location moves below this are smoothed, not stepped
    function linearHold(p, x) {
      if (x <= p[0][0]) return p[0][1];
      if (x >= p[p.length - 1][0]) return p[p.length - 1][1];
      var lo = 0, hi = p.length - 1;
      while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (p[mid][0] <= x) lo = mid; else hi = mid; }
      var span = p[hi][0] - p[lo][0];
      return span < 1e-9 ? p[hi][1] : p[lo][1] + (p[hi][1] - p[lo][1]) * (x - p[lo][0]) / span;
    }

    // Beyond a run's ends the kernel holds the end value, unless the end point
    // has a lead/tail ({run, off}: a bundle-mate's run that continues past this
    // end, plus the constant offset). A line joining or leaving a bundle then
    // reads exactly what its mates read, so it stays parallel to them.
    function smoothRunAt(p, x) {
      var lo = p[0][0], hi = p[p.length - 1][0], lead = p[0][4], tail = p[p.length - 1][5];
      if (!lead && !tail && (p.length === 1 || hi - lo < 1e-9)) return p[0][1];
      var acc = 0, wsum = 0;
      for (var u = -3 * storylineSigma; u <= 3 * storylineSigma + 1e-9; u += storylineSigma / 4) {
        var xx = x + u, y;
        if (xx < lo && lead) y = linearHold(lead.run, xx) + lead.off;
        else if (xx > hi && tail) y = linearHold(tail.run, xx) + tail.off;
        else y = linearHold(p, xx);
        var w = Math.exp(-u * u / (2 * storylineSigma * storylineSigma));
        acc += w * y; wsum += w;
      }
      return acc / wsum;
    }

    function storylineRuns(p) {
      var runs = [];
      p.forEach(function (pt, i) {
        var q = p[i - 1];
        var sameRun = q && (pt[2] === q[2] ||
          (pt[3] >= 0 && pt[3] === q[3] && Math.abs(pt[1] - q[1]) < storylineMergeDy));
        if (sameRun) runs[runs.length - 1].push(pt);
        else runs.push([pt]);
      });
      return runs;
    }

    function runSlopeAt(run, x, dir) {
      return dir * (smoothRunAt(run, x) - smoothRunAt(run, x - dir));
    }

    // Where the move between run A and the next run B is drawn. Frames sit at
    // session boundaries and membership is half-open, so a line is still in A
    // right up to B's first frame xb. A shared session (sid >= 0) pins the
    // line to its slot for its whole span: leaving one, the move starts at xb;
    // joining one, it ends at xb; between two, it ends at xb within the strip
    // the old band leaves free. A solo side isn't pinned, so the move may run
    // on into (or start back inside) the solo stretch, wide enough that its
    // steepest point stays under storylineMaxSlope where there's room. Until
    // the move starts, smoothRunAt holds the line parallel to a bundle-mate
    // (tail link) or flat.
    var storylineTransitionW = 48; // px
    var storylineHandoverDx = 14; // px, < storylineTransitionW / 2
    var storylineMaxSlope = 3.5; // |dy/dx|; a flat-ended Hermite peaks at 1.5x its mean slope
    function transitionWindow(runs, r) {
      var a = runs[r], b = runs[r + 1];
      var xa = a[a.length - 1][0], xb = b[0][0], W = storylineTransitionW;
      var need = Math.max(W, 1.5 * Math.abs(b[0][1] - a[a.length - 1][1]) / storylineMaxSlope);
      var leavesShared = a[a.length - 1][2] >= 0, joinsShared = b[0][2] >= 0;
      // How far a solo side can give room: up to the neighbouring run.
      var bFar = r + 2 < runs.length ? runs[r + 2][0][0] : b[b.length - 1][0] + need;
      var aFar = r > 0 ? runs[r - 1][runs[r - 1].length - 1][0] : a[0][0] - need;
      // Between two shared sessions: inside the band-free strip just before xb
      // (the old session's band stops W/2 early, see buildMultiMemberLocationBands).
      if (leavesShared && joinsShared) return [Math.max(xa, xb - W / 2), xb];
      // Leaving for solo starts storylineHandoverDx early (still past the old
      // band, which stops W/2 early), so if another line takes over this slot
      // at xb, the leaver's bend and the newcomer's bend don't coincide.
      if (leavesShared) {
        var ws = Math.max(xa, xb - storylineHandoverDx);
        return [ws, Math.min(bFar, Math.max(xb, ws + need))];
      }
      if (joinsShared) return [Math.max(aFar, Math.min(xa, xb - need)), xb];
      var mid = (xa + xb) / 2, half = Math.max(xb - xa, need) / 2;
      return [Math.max(aFar, mid - half), Math.min(bFar, mid + half)];
    }

    // All windows of a line, with overlaps (a short solo stop between two
    // moves) split where they meet, so the line reaches the stop, turns with a
    // flat tangent there and goes on, instead of jumping between two curves.
    function transitionWindows(runs) {
      if (runs._windows) return runs._windows;
      var wins = [];
      for (var r = 0; r < runs.length - 1; r++) wins.push(transitionWindow(runs, r));
      for (r = 1; r < wins.length; r++) {
        if (wins[r][0] >= wins[r - 1][1]) continue;
        // Share the combined span in proportion to each move's height.
        var h0 = Math.abs(runs[r][0][1] - runs[r - 1][runs[r - 1].length - 1][1]) + 1;
        var h1 = Math.abs(runs[r + 1][0][1] - runs[r][runs[r].length - 1][1]) + 1;
        var split = wins[r - 1][0] + (wins[r][1] - wins[r - 1][0]) * h0 / (h0 + h1);
        wins[r - 1][1] = wins[r][0] = split;
      }
      runs._windows = wins;
      return wins;
    }

    function smoothYAt(p, x, runs) {
      runs = runs || storylineRuns(p);
      if (x <= runs[0][0][0]) return smoothRunAt(runs[0], runs[0][0][0]);
      var wins = transitionWindows(runs);
      for (var r = 0; r < runs.length - 1; r++) {
        var ws = wins[r][0], we = wins[r][1];
        if (x <= ws) return smoothRunAt(runs[r], x);
        if (x < we) {
          var run = runs[r], next = runs[r + 1];
          var y0 = smoothRunAt(run, ws), y1 = smoothRunAt(next, we), h = we - ws, d = (y1 - y0) / h;
          var m0 = runSlopeAt(run, ws, 1), m1 = runSlopeAt(next, we, -1);
          // Fritsch-Carlson limits keep the transition monotone (no overshoot).
          if (m0 * d <= 0) m0 = 0; else m0 = Math.sign(d) * Math.min(Math.abs(m0), 3 * Math.abs(d));
          if (m1 * d <= 0) m1 = 0; else m1 = Math.sign(d) * Math.min(Math.abs(m1), 3 * Math.abs(d));
          var t = (x - ws) / h, t2 = t * t, t3 = t2 * t;
          return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * h * m0 + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * h * m1;
        }
      }
      return smoothRunAt(runs[runs.length - 1], x);
    }

    // Which session the line belongs to at x (grp; mid-move: the nearer
    // end's session) and the frame point it holds there (slot); sessions are
    // half-open, so that's the last frame at or before x.
    function storylineSampleInfo(runs, x) {
      var wins = transitionWindows(runs);
      function frameAt(run) {
        var best = run[0];
        run.forEach(function (pt) { if (pt[0] <= x) best = pt; });
        return best;
      }
      for (var r = 0; r < runs.length - 1; r++) {
        if (x <= wins[r][0]) { var f = frameAt(runs[r]); return { bind: f[2] >= 0, grp: f[2], slot: f[1] }; }
        if (x < wins[r][1]) {
          var g2 = x - wins[r][0] < wins[r][1] - x ? runs[r][runs[r].length - 1][2] : runs[r + 1][0][2];
          return { bind: false, grp: g2 };
        }
      }
      var f3 = frameAt(runs[runs.length - 1]);
      return { bind: f3[2] >= 0, grp: f3[2], slot: f3[1] };
    }

    var storylineStep = 2; // px between samples

    function storylineSmoothPath(points) {
      var smp = points._samples;
      if (!smp) return null;
      var arr = smp.y.map(function (y, i) { return [(smp.i0 + i) * storylineStep, y]; });
      if (arr.length < 2) return arr.length ? "M" + arr[0][0] + "," + arr[0][1] : null;
      return "M" + storylineCurve(arr);
    }

    // Sample every line on one x-grid, then keep lines that aren't in the same
    // session at least storylineMinClear apart (centre to centre) wherever they
    // don't cross: at each x, adjacent lines (in their unadjusted order) that
    // are too close get pushed apart, moving only samples not pinned to a
    // session slot. Pairs within storylineCrossWindow of a crossing are left
    // alone so they can still cross. Each line's push is then spread with a
    // Gaussian that never shrinks it, so the detour is smooth, not a kink.
    var storylineMinClear = 14; // px
    var storylineCrossWindow = 24; // px
    function computeStorylineSamples(chars, sessionGap) {
      var step = storylineStep;
      var lines = chars.map(function (c) {
        var p = storylineArrays(c.d3.points), runs = storylineRuns(p);
        var i0 = Math.ceil(p[0][0] / step), i1 = Math.max(i0, Math.floor(p[p.length - 1][0] / step));
        var L = { pts: c.d3.points, i0: i0, i1: i1, y0: [], y: [], bind: [], grp: [] };
        for (var i = i0; i <= i1; i++) {
          var x = i * step, info = storylineSampleInfo(runs, x), y = smoothYAt(p, x, runs);
          // Pinned only while actually on its slot: while smoothing spreads a
          // bundle's re-centring shift, the line may still be pushed clear.
          L.y0.push(y); L.y.push(y); L.grp.push(info.grp);
          L.bind.push(info.bind && Math.abs(y - info.slot) < 1);
        }
        return L;
      });
      var minCol = d3.min(lines, function (L) { return L.i0; }), maxCol = d3.max(lines, function (L) { return L.i1; });
      var at = function (L, arr, col) { return col < L.i0 || col > L.i1 ? undefined : arr[col - L.i0]; };

      // nearCross[a][b][col]: their unadjusted order flips within the window.
      var W = Math.round(storylineCrossWindow / step), nearCross = {};
      lines.forEach(function (A, a) {
        lines.forEach(function (B, b) {
          if (b <= a) return;
          var lo = Math.max(A.i0, B.i0), hi = Math.min(A.i1, B.i1), sg = {}, flag = {};
          for (var col = lo; col <= hi; col++) sg[col] = Math.sign(at(A, A.y0, col) - at(B, B.y0, col));
          for (col = lo; col <= hi; col++) {
            for (var k = Math.max(lo, col - W); k <= Math.min(hi, col + W); k++) {
              if (sg[k] !== sg[col] || sg[col] === 0) { flag[col] = true; break; }
            }
          }
          nearCross[a + "," + b] = flag;
        });
      });

      function push() {
        for (var col = minCol; col <= maxCol; col++) {
          var act = [];
          lines.forEach(function (L, idx) { if (col >= L.i0 && col <= L.i1) act.push(idx); });
          act.sort(function (a, b) { return at(lines[a], lines[a].y0, col) - at(lines[b], lines[b].y0, col); });
          for (var it = 0; it < 8; it++) {
            for (var k = 0; k + 1 < act.length; k++) {
              var ia = act[k], ib = act[k + 1], A = lines[ia], B = lines[ib];
              var key = Math.min(ia, ib) + "," + Math.max(ia, ib);
              if (nearCross[key][col]) continue;
              var ga = at(A, A.grp, col), gb = at(B, B.grp, col);
              var need = ga >= 0 && ga === gb ? sessionGap : storylineMinClear;
              var ja = col - A.i0, jb = col - B.i0, deficit = need - (B.y[jb] - A.y[ja]);
              if (deficit <= 1e-6) continue;
              var fa = A.bind[ja], fb = B.bind[jb];
              if (fa && fb) continue;
              if (fa) B.y[jb] += deficit;
              else if (fb) A.y[ja] -= deficit;
              else { A.y[ja] -= deficit / 2; B.y[jb] += deficit / 2; }
            }
          }
        }
      }
      function spread(L) {
        var n = L.y.length, d = L.y.map(function (y, i) { return y - L.y0[i]; }), out = d.slice();
        var sig = 8 / step, R = Math.ceil(3 * sig);
        var nearBind = L.bind.map(function (b, i) {
          for (var k = Math.max(0, i - R); k <= Math.min(n - 1, i + R); k++) if (L.bind[k]) return true;
          return false;
        });
        for (var i = 0; i < n; i++) {
          if (L.bind[i]) { out[i] = 0; continue; }
          var acc = 0, ws = 0;
          for (var k = Math.max(0, i - R); k <= Math.min(n - 1, i + R); k++) {
            var w = Math.exp(-(k - i) * (k - i) / (2 * sig * sig));
            acc += w * d[k]; ws += w;
          }
          var g = acc / ws;
          // Never shrink a push, except next to a pinned stretch, where it
          // has to ease off to 0 (plain Gaussian) or the line would step
          // onto its rail; clearance there can fall a little short.
          out[i] = nearBind[i] ? g : d[i] > 0 ? Math.max(g, d[i]) : d[i] < 0 ? Math.min(g, d[i]) : g;
        }
        L.y = out.map(function (v, i) { return L.y0[i] + v; });
      }
      for (var pass = 0; pass < 4; pass++) { push(); lines.forEach(spread); }
      lines.forEach(function (L) { L.pts._samples = { i0: L.i0, y: L.y, y0: L.y0, bind: L.bind, grp: L.grp }; });
    }

    var options = {
      svg: {
        height: 700,
        width: 3000,
        topPadding: 55,
        leftGutter: 170,
        autoHeight: true,
        minHeight: 480,
        maxHeight: 1800,
        rowHeight: 36
      },
      animation: { transitionDuration: 700 },
      characters: {
        interpolation: storylineCurve,
        class: "line",
        labelClass: "name",
        labelX: 4,
        labelDy: -4,
        sessionCoefficient: 2,
        sessionGap: 12,      // px between same-session lines (centre to centre)
        strokeWidth: 5,
        highlightStrokeWidth: 9,
        highlightDuration: 300,
        nonHighlightedOpacity: 0.2,
        toKeep: null
      },
      locations: {
        interpolation: "monotone",
        fontSize: "17px",
        labelX: 12,
        labelDy: -10,
        padding: 18,
        opacity: 0.16,
        cornerStrokeWidth: 8,
        class: "locationPath",
        labelClass: "locationLabel",
        splitLength: 400,
        hierarchy: {
          enabled: true,
          opacity: 0,
          padding: 16,
          paddingStep: 0
        }
      },
      algorithm: {
        sweepingMaxIterations: 20,
        globalOrderOptimizePasses: 8,
        globalOrderSmoothWeight: 0.65,
        stableNeeded: 2,              // 不足⑤で使ってるなら統一
        missingEntityPolicy: "hold",  // "hold" | "bottom"
        missingEntityPenalty: 100000,  // "bottom" のときの大きい値

        // ---- 5.3 / 5.4 ----
        alpha: 0.1,          // 5.3 session sim の α
        din: 34,             // 5.4 (5c) 同一セッション内の隣接距離
        continuityWeight: 1, // 5.3 同じ場所に留まる人物の直線本数の追加重み(0で論文Eq.3そのまま)
        dout: 76,            // 5.4 (5d) 異セッション間の最小距離
        epsOrder: 1e-3,      // 5.4 (5a) orderの厳密性

        lambdaWhite: 0.02,   // 目的関数：whitespace項の重み
        wiggleWeight: 8.0,   // 時間方向の上下移動を抑える重み
        sessionStabilityWeight: 60, // 同一セッションに居続けるフレーム間の移動に上乗せする重み（セッション全体の不要な上下動を抑制）
        consistencyWeight: 0.0,   // 0..1: crossing優先 ↔ 配置一貫性優先

        // ADMM solver settings
        rho: 2.0,
        sigma: 1e-6,         // (Q + rho A^T A + sigma I) を正則化
        maxIterQP: 6000,
        epsAbs: 1e-6,
        epsRel: 1e-6,
        useOSQP: true
      },
      bundle: {
        enabled: false,
        lineWidth: 6,
        opacity: 0.6
      }
    };

    $(document).ready(function () {
      $("#redrawAll").button().on("click", function () {
        renderAllDatasets();
      });

      $("#bundleToggle").on("change", function () {
        options.bundle.enabled = $(this).is(":checked");
        renderAllDatasets();
      });

      $("#consistencyWeight").on("input change", function () {
        var v = parseFloat($(this).val());
        if (!isFinite(v)) return;
        options.algorithm.consistencyWeight = v;
        $("#consistencyWeightVal").text(v.toFixed(2));
        renderAllDatasets();
      });

      $("#consistencyWeightVal").text(options.algorithm.consistencyWeight.toFixed(2));

      $("#workLabelToggle").on("change", function () {
        $("#canvases").toggleClass("hideWorkLabels", !$(this).is(":checked"));
      });

      $("#secondaryLineToggle").on("change", function () {
        $("#canvases").toggleClass("hideSecondaryLines", !$(this).is(":checked"));
      });

      if (options.algorithm.useOSQP) {
        ensureOSQPReady(renderAllDatasets);
      } else {
        renderAllDatasets();
      }
    });

    function ensureOSQPReady(cb) {
      if (osqpModule) {
        cb();
        return;
      }
      if (typeof OSQPModule !== "function") {
        cb();
        return;
      }
      if (!osqpModulePromise) {
        osqpModulePromise = OSQPModule()
          .then(function (mod) {
            osqpModule = mod;
            return mod;
          })
          .catch(function (err) {
            console.error("OSQPModule init failed:", err);
            options.algorithm.useOSQP = false;
            return null;
          });
      }
      var settled = false;
      function finish() {
        if (settled) return;
        settled = true;
        cb();
      }
      osqpModulePromise.then(finish);
      setTimeout(function () {
        if (settled) return;
        console.warn("OSQPModule init timed out; falling back to ADMM.");
        osqpModule = null;
        options.algorithm.useOSQP = false;
        finish();
      }, 3000);
    }

    function getDatasetListFromSelect() {
      return [DATASET];
    }

    function kendallDistance(orderA, orderB) {
      var rankA = {};
      var rankB = {};
      for (var i = 0; i < orderA.length; i++) rankA[orderA[i]] = i;
      for (var j = 0; j < orderB.length; j++) rankB[orderB[j]] = j;

      var common = [];
      for (var k = 0; k < orderA.length; k++) {
        var id = orderA[k];
        if (rankB[id] !== undefined) common.push(id);
      }

      var n = common.length;
      if (n < 2) return { discordant: 0, totalPairs: 0, normalized: 0, n: n };

      var discordant = 0;
      for (var i2 = 0; i2 < n - 1; i2++) {
        var ai = common[i2];
        for (var j2 = i2 + 1; j2 < n; j2++) {
          var aj = common[j2];
          var signA = rankA[ai] - rankA[aj];
          var signB = rankB[ai] - rankB[aj];
          if ((signA > 0 && signB < 0) || (signA < 0 && signB > 0)) discordant++;
        }
      }

      var totalPairs = n * (n - 1) / 2;
      var normalized = totalPairs ? (discordant / totalPairs) : 0;
      return { discordant: discordant, totalPairs: totalPairs, normalized: normalized, n: n };
    }

    function renderAllFromResults(results) {
      d3.select("#canvases").html("");
      results.forEach(function (res, idx) {
        var panel = d3.select("#canvases")
          .append("div")
          .attr("class", "panel")
          .attr("id", "panel-" + idx);

        panel.append("h3").text(res.info.name);

        if (res.error) {
          panel.append("div")
            .style("color", "crimson")
            .style("padding", "8px 0 12px 0")
            .text("Failed to load: " + res.info.path);
          return;
        }

        var svg = panel.append("svg")
          .attr("height", options.svg.height)
          .attr("width", options.svg.width);

        drawStoryFlow(res.data, res.options, svg, "p" + idx + "-");
      });
    }

    function renderAllDatasets() {
      if (options.algorithm.useOSQP && !osqpModule && typeof OSQPModule === "function") {
        ensureOSQPReady(renderAllDatasets);
        return;
      }

      var datasets = getDatasetListFromSelect();
      var results = new Array(datasets.length);
      var remaining = datasets.length;

      if (remaining === 0) {
        d3.select("#canvases").html("");
        return;
      }

      datasets.forEach(function (dsInfo, idx) {
        d3.json(dsInfo.path, function (error, json) {
          if (error) {
            console.error(error);
            results[idx] = { info: dsInfo, error: true };
          } else {
            console.log("LOADED:", dsInfo.path, "keys=", Object.keys(json));
            console.log("HAS locationTree?", !!json.locationTree, json.locationTree);

            var local = jQuery.extend(true, {}, json);
            var localOptions = jQuery.extend(true, {}, options);
            localOptions.characters.toKeep = null;

            if (localOptions.bundle && localOptions.bundle.enabled) {
              localOptions.algorithm.din = 0;
            }

            var annotated = annotateDataset(local, localOptions);
            results[idx] = { info: dsInfo, data: annotated, options: localOptions, error: false };
          }

          remaining--;
          if (remaining === 0) renderAllFromResults(results);
        });
      });
    }

    function drawStoryFlow(dataset, options, svg, idPrefix) {
      idPrefix = idPrefix || "";

      var characterColors = dataset.characters.length <= 10 ? d3.scale.category10() : d3.scale.category20();
      var locationColors = dataset.locations.length <= 10 ? d3.scale.category10() : d3.scale.category20();

      for (var i = 0; i < dataset.characters.length; ++i) {
        dataset.characters[i].d3 = { color: dataset.characters[i].color || characterColors(i) };
      }

      for (i = 0; i < dataset.locations.length; ++i) {
        dataset.locations[i].d3 = { color: locationColors(i) };
      }

      var maxCharacters = dataset.d3.time
        .map(function (time) { return (time.sortedCharacters ? time.sortedCharacters.length : 0); })
        .reduce(function (x, y) { return Math.max(x, y); }, 0); // ← 初期値 0

      if (!dataset.d3 || !dataset.d3.time || dataset.d3.time.length === 0) {
        svg.append("text")
          .attr("x", 20).attr("y", 40)
          .style("font-size", "18px")
          .text("No frames to draw (dataset.d3.time is empty)");
        return;
      }

      var axisPadding = 32;
      var hasAnyQP = dataset.d3.time.some(function (tm) { return tm.d3 && tm.d3.y; });
      var qpRange = null;

      if (hasAnyQP) {
        var minY = Infinity, maxY = -Infinity;

        for (var t0 = 0; t0 < dataset.d3.time.length; t0++) {
          var tm = dataset.d3.time[t0];
          if (!tm.d3 || !tm.d3.y) continue;

          for (var k0 = 0; k0 < tm.sortedCharacters.length; k0++) {
            var cid0 = tm.sortedCharacters[k0];
            var y0 = tm.d3.y[cid0];
            if (y0 == null || !isFinite(y0)) continue;
            if (y0 < minY) minY = y0;
            if (y0 > maxY) maxY = y0;
          }
        }

        if (isFinite(minY) && isFinite(maxY)) {
          qpRange = { minY: minY, maxY: maxY, span: maxY - minY };
        }
      }

      if (options.svg && options.svg.autoHeight) {
        var rowHeight = (typeof options.svg.rowHeight === "number") ? options.svg.rowHeight
          : (options.algorithm && typeof options.algorithm.din === "number") ? options.algorithm.din : 24;
        var baseHeight = options.svg.topPadding + axisPadding + rowHeight * Math.max(1, maxCharacters);
        var targetHeight = baseHeight;

        if (qpRange) {
          var qpHeight = options.svg.topPadding + axisPadding + qpRange.span;
          if (qpHeight > targetHeight) targetHeight = qpHeight;
        }

        var minHeight = (typeof options.svg.minHeight === "number") ? options.svg.minHeight : 0;
        var maxHeight = (typeof options.svg.maxHeight === "number") ? options.svg.maxHeight : 0;

        if (minHeight && targetHeight < minHeight) targetHeight = minHeight;
        if (maxHeight && targetHeight > maxHeight) targetHeight = maxHeight;

        options.svg.height = Math.ceil(targetHeight);
        svg.attr("height", options.svg.height);
      }
      var axisY = options.svg.height - 16;
      var plotHeight = axisY - options.svg.topPadding;

      var verticalScale = d3.scale.linear()
        .domain([0, maxCharacters])
        .range([options.svg.topPadding, options.svg.height - axisPadding]);

      var leftGutter = (options.svg && typeof options.svg.leftGutter === "number") ? options.svg.leftGutter : 0;

      var timeValues = (dataset.timeValues && dataset.timeValues.length)
        ? dataset.timeValues.map(function (d) { return +d; })
        : null;

      function timeValueForIndex(index) {
        if (timeValues) {
          if (timeValues[index] !== undefined) return timeValues[index];
          var lo = Math.floor(index);
          var hi = Math.ceil(index);
          if (timeValues[lo] !== undefined && timeValues[hi] !== undefined && hi !== lo) {
            var ratio = index - lo;
            return timeValues[lo] + (timeValues[hi] - timeValues[lo]) * ratio;
          }
          if (timeValues[lo] !== undefined) return timeValues[lo];
          if (timeValues[hi] !== undefined) return timeValues[hi];
        }
        return index;
      }

      function xForTimeIndex(localIndex) {
        return horizontalScale(timeValueForIndex(dataset.d3.timeStart + localIndex));
      }

      var horizontalDomain = timeValues
        ? [
          d3.min([d3.min(timeValues), dataset.timeLabels ? d3.min(dataset.timeLabels.map(function (d) { return +d; })) : d3.min(timeValues)]),
          d3.max([d3.max(timeValues), dataset.timeLabels ? d3.max(dataset.timeLabels.map(function (d) { return +d; })) : d3.max(timeValues)])
        ]
        : [0, dataset.d3.time.length];

      var horizontalScale = d3.scale.linear()
        .domain(horizontalDomain)
        .range([leftGutter, options.svg.width]);

      var timeTicks = timeValues && dataset.timeLabels
        ? dataset.timeLabels.map(function (d) { return +d; })
        : d3.range(0, dataset.d3.time.length + 1);
      var timeAxis = d3.svg.axis()
        .scale(horizontalScale)
        .orient("bottom")
        .tickValues(timeTicks)
        .tickFormat(function (d) {
          if (timeValues) return d;
          if (dataset.timeLabels && dataset.timeLabels[d] !== undefined) return dataset.timeLabels[d];
          return dataset.d3.timeStart + d;
        });

      var timeGrid = d3.svg.axis()
        .scale(horizontalScale)
        .orient("bottom")
        .tickValues(timeTicks)
        .tickSize(-plotHeight, 0)
        .tickFormat("");

      svg.selectAll(".timeAxis").remove();
      svg.selectAll(".timeGrid").remove();
      svg.append("g")
        .attr("class", "axis timeGrid")
        .attr("transform", "translate(0," + axisY + ")")
        .call(timeGrid);
      svg.append("g")
        .attr("class", "axis timeAxis")
        .attr("transform", "translate(0," + axisY + ")")
        .call(timeAxis);

      // =========================
      // QP y -> screen y transform
      // =========================
      var yA = 1.0, yB = 0.0; // y_screen = yA*y_qp + yB

      if (hasAnyQP && qpRange) {
        var minY = qpRange.minY;
        var maxY = qpRange.maxY;

        if (isFinite(minY) && isFinite(maxY)) {
          var top = options.svg.topPadding;
          var bottom = options.svg.height - 10;
          var avail = bottom - top;
          var span = Math.max(1e-9, maxY - minY);

          // まずは距離感維持（a=1）で、上に持ち上げる
          yA = 1.0;

          // そのままだと下にはみ出すなら縮小
          if (span * yA > avail) {
            yA = avail / span;
          }

          // minY を top に合わせて平行移動
          yB = top - yA * minY;
        }
      }

      dataset.characters.forEach(function (c) { if (c.d3) c.d3.points = []; });
      dataset.locations.forEach(function (l) { if (l.d3) l.d3.points = []; });
      dataset.locations.forEach(function (loc) {
        loc.hasMultiMemberSession = dataset.sessions.some(function (session) {
          return session.location === loc.id && session.members && session.members.length > 1;
        });
      });

      // Shared (multi-member) session a character is in at this frame, or -1.
      function sharedSessionAt(time, cid) {
        for (var li = 0; li < time.locations.length; li++) {
          var ids = time.locations[li].sessions;
          for (var si = 0; si < ids.length; si++) {
            var members = dataset.sessions[ids[si]].members;
            if (members.length > 1 && members.indexOf(cid) !== -1) return ids[si];
          }
        }
        return -1;
      }

      // Previous frame's final y and shared location per character (bundle anchoring below).
      var prevY = {}, prevLoc = {};
      for (var t = 0; t < dataset.d3.time.length; ++t) {
        var time = dataset.d3.time[t];

        // QP y があるならそれを使う
        var hasQP = (time.d3 && time.d3.y);

        // fallback: old behavior needs characterGroups/offset
        if (!hasQP) {
          var characterGroups = time.locations
            .map(function (x) {
              return x.sessions.map(function (sId) {
                return dataset.sessions[sId].members.length;
              });
            })
            .reduce(function (x, y) { return x.concat(y); }, []);

          var offset = 0;

          characterGroups.forEach(function (charactersInSession) {
            var mean = 0;
            for (i = 0; i < charactersInSession; ++i) mean += verticalScale(offset + i);
            mean /= charactersInSession;

            for (i = 0; i < charactersInSession; ++i) {
              var cid = time.sortedCharacters[offset + i];
              var character = dataset.characters.filter(function (character) {
                return character.id == cid;
              })[0];

              if (character.isRemoved) continue;
              if (!character.d3) character.d3 = { color: character.color || characterColors(character.id) };
              if (character.d3.points === undefined) character.d3.points = [];

            character.d3.points.push({
              x: xForTimeIndex(t),
              y: mean + ((verticalScale(offset + i) - mean) / options.characters.sessionCoefficient)
            });
            }

            offset += charactersInSession;
          });

        } else {
          // QP layout
          var framePoints = {}, frameAll = [];
          for (var k = 0; k < time.sortedCharacters.length; k++) {
            var cid2 = time.sortedCharacters[k];
            var character2 = dataset.characters.filter(function (character) {
              return character.id == cid2;
            })[0];

            if (!character2 || character2.isRemoved) continue;
            if (!character2.d3) character2.d3 = { color: character2.color || characterColors(character2.id) };
            if (!character2.d3.points) character2.d3.points = [];

            var qpPoint = {
              x: xForTimeIndex(t),
              y: yA * time.d3.y[cid2] + yB,  // ★これが最終y（QP結果）
              sid: sharedSessionAt(time, cid2),
              cid: cid2
            };
            frameAll.push(qpPoint);
            character2.d3.points.push(qpPoint);
            qpPoint.loc = qpPoint.sid >= 0 ? dataset.sessions[qpPoint.sid].location : -1;
            if (qpPoint.sid >= 0) (framePoints[qpPoint.sid] = framePoints[qpPoint.sid] || []).push(qpPoint);
          }

          // Re-place each session's members exactly sessionGap px apart, in
          // sortedCharacters order: constant offsets every frame, so lines stay
          // parallel (the ADMM solve stops before the din equality (5c) is exact).
          // Where the bundle sits: if it continues at the same location, anchor
          // it so its continuing members keep last frame's y (least-squares),
          // instead of following the QP, which drifts a few px every frame
          // (solver noise) and shows as a wave. The QP position (of the staying
          // members, else of everyone) is used for new bundles, when the
          // anchor would drift more than 3 gaps from it (a real move), or when
          // anchoring would break the frame's line order/clearance.
          var gap = options.characters.sessionGap;
          // Lines the alignment step (5.3) chose to keep straight from t-1 to t.
          var prevAl = t > 0 && dataset.d3.time[t - 1].d3 && dataset.d3.time[t - 1].d3.alignment;
          var aligned = {};
          (prevAl ? prevAl.alignedSegments : []).forEach(function (seg) { aligned[seg.cid] = true; });
          function placeBlocks(useAnchor) {
            Object.keys(framePoints).forEach(function (sid) {
              var block = framePoints[sid], n = block.length, loc = dataset.sessions[sid].location;
              var slot = function (i) { return (i - (n - 1) / 2) * gap; };
              // Reference: where the QP put the members that stay at this
              // location (alignment keeps those straight); the mean of all
              // members only for a bundle with no one staying.
              var anchors = [], qpStay = [], straight = [];
              block.forEach(function (pt, i) {
                if (prevLoc[pt.cid] !== loc) return;
                anchors.push(prevY[pt.cid] - slot(i));
                qpStay.push(pt.qpY - slot(i));
                if (aligned[pt.cid]) straight.push(prevY[pt.cid] - slot(i));
              });
              var centre = qpStay.length ? d3.mean(qpStay) : d3.mean(block, function (pt) { return pt.qpY; });
              // A staying member the alignment keeps straight is held exactly
              // (the ADMM solve only approximates that equality); otherwise
              // follow the previous frame unless the QP moved the bundle a lot.
              if (useAnchor && straight.length) centre = d3.mean(straight);
              else if (useAnchor && anchors.length && Math.abs(d3.mean(anchors) - centre) < 3 * gap) centre = d3.mean(anchors);
              block.forEach(function (pt, i) { pt.y = centre + slot(i); });
            });
          }
          frameAll.forEach(function (pt) { pt.qpY = pt.y; });
          placeBlocks(true);
          var ordered = frameAll.every(function (pt, i) {
            if (i === 0) return true;
            var q = frameAll[i - 1];
            return pt.y - q.y >= (pt.sid >= 0 && pt.sid === q.sid ? gap : 1.5 * gap) - 1e-6;
          });
          if (!ordered) placeBlocks(false);
          prevY = {}; prevLoc = {};
          frameAll.forEach(function (pt) {
            delete pt.qpY;
            prevY[pt.cid] = pt.y;
            prevLoc[pt.cid] = pt.sid >= 0 ? pt.loc : undefined;
          });
        }
      }

      function ensureCharacterPointsVisible() {
        var minY = Infinity;
        var maxY = -Infinity;
        dataset.characters.forEach(function (character) {
          if (!character || !character.d3 || !character.d3.points) return;
          character.d3.points.forEach(function (point) {
            if (!isFinite(point.y)) return;
            minY = Math.min(minY, point.y);
            maxY = Math.max(maxY, point.y);
          });
        });
        if (!isFinite(minY) || !isFinite(maxY)) return;

        var topLimit = options.svg.topPadding + 20;
        var bottomPadding = 52;
        var shiftY = minY < topLimit ? (topLimit - minY) : 0;
        if (shiftY !== 0) {
          dataset.characters.forEach(function (character) {
            if (!character || !character.d3 || !character.d3.points) return;
            character.d3.points.forEach(function (point) {
              point.y += shiftY;
            });
          });
          minY += shiftY;
          maxY += shiftY;
        }

        var neededHeight = Math.ceil(maxY + bottomPadding);
        if (neededHeight > options.svg.height) {
          options.svg.height = neededHeight;
          svg.attr("height", options.svg.height);
          axisY = options.svg.height - 16;
          plotHeight = axisY - options.svg.topPadding;
          timeGrid.tickSize(-plotHeight, 0);
          svg.select(".timeGrid")
            .attr("transform", "translate(0," + axisY + ")")
            .call(timeGrid);
          svg.select(".timeAxis")
            .attr("transform", "translate(0," + axisY + ")")
            .call(timeAxis);
        }
      }

      ensureCharacterPointsVisible();

      // Give each run end inside a shared session a lead/tail: a co-member at
      // that frame whose own run extends past it (see smoothRunAt).
      (function linkBundleMates() {
        var chars = dataset.characters.filter(function (c) { return c.d3 && c.d3.points && c.d3.points.length; });
        chars.forEach(function (c) { c.d3.points.forEach(function (pt) { delete pt.lead; delete pt.tail; }); });
        chars.forEach(function (c) { c.d3.runs = storylineRuns(storylineArrays(c.d3.points)); });
        function link(c, end, key, extends_) {
          if (end[2] < 0) return;
          var obj = c.d3.points.filter(function (q) { return q.x === end[0]; })[0];
          chars.some(function (m) {
            if (m === c) return false;
            return m.d3.runs.some(function (r) {
              var at = r.filter(function (q) { return q[0] === end[0] && q[2] === end[2]; })[0];
              if (!at || !extends_(r)) return false;
              obj[key] = { run: r, off: end[1] - at[1] };
              return true;
            });
          });
        }
        chars.forEach(function (c) {
          c.d3.runs.forEach(function (run) {
            var first = run[0], last = run[run.length - 1];
            link(c, first, "lead", function (r) { return r[0][0] < first[0]; });
            link(c, last, "tail", function (r) { return r[r.length - 1][0] > last[0]; });
          });
        });
      })();

      computeStorylineSamples(dataset.characters.filter(function (c) {
        return c.d3 && c.d3.points && c.d3.points.length;
      }), options.characters.sessionGap);

      for (t = 0; t < dataset.d3.time.length; ++t) {
        time = dataset.d3.time[t];

        for (i = 0; i < time.locations.length; ++i) {
          var sessions = time.locations[i].sessions;

          for (var k = 0; k < sessions.length; ++k) {
            var session = dataset.sessions[sessions[k]];
            var location = dataset.locations[session.location];

            for (var h = 0; h < session.members.length; ++h) {
              var character2 = dataset.characters.filter(function (character) {
                return character.id == session.members[h];
              })[0];

              if (location.d3.points == undefined) location.d3.points = [];

              character2.d3.points.forEach(function (characterPoint) {
                if (Math.abs(characterPoint.x - xForTimeIndex(t)) > 1e-6) return;

                if (location.d3.points.length == 0) {
                  location.d3.points.push({ top: characterPoint, bottom: characterPoint });
                } else {
                  var lastPoint = location.d3.points[location.d3.points.length - 1];

                  if (lastPoint.top.x == characterPoint.x) {
                    if (lastPoint.top.y > characterPoint.y) {
                      location.d3.points[location.d3.points.length - 1].top = characterPoint;
                    } else if (lastPoint.bottom.y < characterPoint.y) {
                      location.d3.points[location.d3.points.length - 1].bottom = characterPoint;
                    }
                  } else {
                    location.d3.points.push({ top: characterPoint, bottom: characterPoint });
                  }
                }

            var aLoc = ds.locations[a.location];
            var bLoc = ds.locations[b.location];
            var an = aLoc && aLoc.name ? aLoc.name : "";
            var bn = bLoc && bLoc.name ? bLoc.name : "";
            return an < bn ? -1 : (an > bn ? 1 : 0);
          });

          for (var sid = 0; sid < orderedSessions.length; sid++) {
            var sess = orderedSessions[sid];
            var members = sess.members || [];
            var color = blendColorForMembers(members);
            var seg = [];
            var segIndex = 0;

            for (var t = 0; t < ds.d3.time.length; t++) {
              var actual = timeStart + t;
              if (!(sess.start <= actual && actual < sess.end)) {
                if (seg.length > 0) {
                  bands.push({ key: "s" + sess.id + "-" + segIndex, sid: sess.id, color: color, points: seg });
                  seg = [];

                continue;

              var moment = ds.d3.time[t];
              if (!moment || !moment.d3 || !moment.d3.y) continue;

              var ys = [];
              for (var mi = 0; mi < members.length; mi++) {
                var y = moment.d3.y[members[mi]];

      function renderSecondaryBranches(dataset, options) {
        var groupSel = svg.selectAll(".secondaryLineGroup").data([0]);
        groupSel.enter().append("g").attr("class", "secondaryLineGroup");
        var secondaryLine = d3.svg.line().interpolate(options.characters.interpolation)
          .x(function (d) { return d.x; })
          .y(function (d) { return d.y; });

        var entries = (dataset.secondarySessions || []).map(function (entry) {
          var character = dataset.characters.filter(function (c) { return c.id === entry.character; })[0];
          var location = dataset.locations[entry.location];
          if (!character || !character.d3 || !character.d3.points || !character.d3.points.length || !location) return null;
          var xStart = eventX(+entry.startYear);
          var xEnd = eventX(+entry.endYear);
          if (xStart === null || xEnd === null || xEnd <= xStart) return null;
          var mid = (xStart + xEnd) / 2;
          // Read from the already-computed in-memory point arrays (yAtXFromPoints)
          // instead of querying the live SVG path (pointOnPathAtX does a linear
          // getPointAtLength scan over the whole path, which is very expensive
          // when called this many times per secondary session).
          var midMainY = yAtXFromPoints(character.d3.points, mid);
          if (midMainY === null) return null;

          // Pick the branch's side and arc height: full arcs first, then damped
          // ones, keeping the branch's middle (its ends sit on its own main
          // line) at least branchClear px clear of every other line, edge to
          // edge, along the whole span. If nothing fits, take the fewest clashes.
          var rowHeight = (options.svg && options.svg.rowHeight) || 36;
          var branchClear = 6 + options.characters.strokeWidth * 0.75; // centre distance: 6px gap + half of each stroke
          var steps = Math.max(6, Math.min(40, Math.round((xEnd - xStart) / 18)));
          var xsB = [], baseYs = [], otherYs = [];
          for (var s = 0; s <= steps; s++) {
            var xB = xStart + (xEnd - xStart) * s / steps, by = yAtXFromPoints(character.d3.points, xB);
            xsB.push(xB);
            baseYs.push(by === null ? midMainY : by);
          }
          dataset.characters.forEach(function (other) {
            if (other.id === character.id || !other.d3 || !other.d3.points || !other.d3.points.length) return;
            otherYs.push(xsB.map(function (xB) { return yAtXFromPoints(other.d3.points, xB); }));
          });
          var best = null;
          [1, 0.6, 0.35].forEach(function (damp) {
            [0.65, -0.65, 1.3, -1.3].forEach(function (k) {
              var off = k * rowHeight * damp, clashes = 0;
              for (var s2 = 0; s2 <= steps; s2++) {
                var t2 = s2 / steps;
                if (t2 < 0.15 || t2 > 0.85) continue;
                var yB = baseYs[s2] + off * Math.sin(Math.PI * t2);
                otherYs.forEach(function (ys) { if (ys[s2] !== null && Math.abs(ys[s2] - yB) < branchClear) clashes++; });
              }
              if (!best || clashes < best.clashes) best = { off: off, clashes: clashes };
            });
          });
          var offset = best.off;

          var points = [];
          for (s = 0; s <= steps; s++) {
            // ease so the branch splits away from and merges back into the main line
            points.push({ x: xsB[s], y: baseYs[s] + offset * Math.sin(Math.PI * s / steps) });
          }
          return {
            key: entry.character + "-" + entry.location + "-" + entry.startYear,
            color: character.d3.color,
            locationName: location.name,
            points: points,
            labelX: mid,
            labelY: midMainY + offset

        }).filter(function (x) { return x; });

        var lines2 = svg.select(".secondaryLineGroup").selectAll(".secondaryLine").data(entries, function (d) { return d.key; });
        lines2.enter().append("path").attr("class", "secondaryLine").append("title");
        lines2

          .attr("fill", "none")
          .attr("stroke", function (d) { return d.color; })
          .attr("stroke-width", options.characters.strokeWidth * 0.5);
        lines2.select("title").text(function (d) { return d.locationName; });
        lines2.exit().remove();

        var labels2 = svg.select(".secondaryLineGroup").selectAll(".secondaryLineLabel").data(entries, function (d) { return d.key; });
        labels2.enter().append("text").attr("class", "secondaryLineLabel");
        labels2

          .attr("text-anchor", "middle")
          .text(function (d) { return d.locationName; });
        labels2.exit().remove();

        if (!isFinite(year) || year < labels[0] || year > labels[labels.length - 1]) return null;
        for (var ei = 0; ei < labels.length - 1; ei++) {

      function pointOnPathAtX(character, x) {
        if (!character || x === null) return null;
        var path = document.getElementById(idPrefix + options.characters.class + character.id);
        if (!path || typeof path.getTotalLength !== "function") return null;
        var len = path.getTotalLength();
        if (!isFinite(len) || len <= 0) return null;

        var samples = Math.max(120, Math.ceil(len / 6));
        var prev = path.getPointAtLength(0);
        var best = prev;
        for (var step = 1; step <= samples; step++) {
          var cur = path.getPointAtLength((len * step) / samples);
          if (Math.abs(cur.x - x) < Math.abs(best.x - x)) best = cur;
          if ((prev.x <= x && x <= cur.x) || (cur.x <= x && x <= prev.x)) {
            var span = cur.x - prev.x;
            var ratio = Math.abs(span) < 1e-9 ? 0 : (x - prev.x) / span;
            return {
              x: x,
              y: prev.y + (cur.y - prev.y) * ratio
            };
          }
          prev = cur;
        }
        return { x: x, y: best.y };

      function buildWorkEventLabelLayout(events, placeLabels) {
        var occupied = [];
        placeLabels.forEach(function (label) {
          var w = estimateLabelWidth(label.name, 17);

        function labelBoxNearLine(box) {

        events.slice().sort(function (a, b) {

            { dx: 7, dy: 17 },
            { dx: -w - 7, dy: -9 },
            { dx: -w - 7, dy: 17 },
            { dx: 7, dy: -37 },
            { dx: -w - 7, dy: -23 },
            { dx: 7, dy: 31 },
            { dx: -w - 7, dy: 31 }

          var chosen = null;
          for (var ci = 0; ci < candidates.length; ci++) {

            var box = { x: event.x + c.dx, y: event.y + c.dy - h, w: w, h: h };

            if (!occupied.some(function (taken) { return boxesOverlap(box, taken); }) && !labelBoxNearLine(box)) {

          if (!chosen) {

            var fallbackBox = { x: event.x + 7, y: fallbackY - h, w: w, h: h };
            while (tries < 12 &&

            tries++;

      // -----------------------------

      function deepClone(obj) {

      function buildLocationPathMap(root) {
        var map = {};

        function dfs(node, path) {
          if (!node) return;
          if (typeof node.id === "number") map[node.id] = path.slice();
          var kids = node.children || [];
          for (var i = 0; i < kids.length; i++) {
            dfs(kids[i], path.concat([i]));

      // locationTree の各ノードに parent を付け、id→node の辞書を作る
      function indexLocationTree(root) {
        var byId = {};

        function dfs(node, parent) {
          // id が数値（location id）であれば登録
          if (node.id !== undefined && node.id !== null && node.id !== "root") {
            byId[node.id] = node;
          }
          if (!node.children) node.children = [];
          node.children.forEach(function (ch) { dfs(ch, node); });

      function pruneInactiveLocations(root, activeLocationIdSet) {
