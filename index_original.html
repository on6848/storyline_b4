<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">

<head lang="en">
  <meta charset="UTF-8">
  <title>StoryFlow: Tracking the Evolution of Stories</title>
  <link rel="stylesheet" type="text/css" href="lib/jquery-ui-themes-1.11.4/themes/flick/jquery-ui.min.css" />
  <link rel="stylesheet" type="text/css" href="lib/jquery.sumoselect/sumoselect.css" />

  <script type="text/javascript" src="lib/d3.v3.js"></script>
  <script type="text/javascript" src="lib/jquery-ui-1.11.4/external/jquery/jquery.js"></script>
  <script type="text/javascript" src="lib/jquery-ui-1.11.4/jquery-ui.min.js"></script>
  <script type="text/javascript" src="lib/jquery.sumoselect/jquery.sumoselect.js"></script>
  <script type="text/javascript" src="lib/osqp/osqp.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    #controls {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
    }

    #canvases {
      padding: 12px;
    }

    .panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 14px;
      padding: 10px 10px 0 10px;
      background: #fafafa;
    }

    .panel h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 700;
    }

    .panel .meta {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #666;
    }

    .axis path,
    .axis line {
      fill: none;
      stroke: #999;
      shape-rendering: crispEdges;
    }

    .axis text {
      font-size: 10px;
      fill: #666;
    }

    .timeGrid path {
      display: none;
    }

    .timeGrid line {
      stroke: #eee;
    }



  </style>
</head>

<body>
  <div id="controls">
    <table>
      <tr>
        <td>
          <select name="dataset" id="dataset">
            <option value="dataset/municipality_sessions.json">市区町村セッション</option>
            <option value="dataset/prefecture_sessions.json">都道府県セッション</option>
          </select>
        </td>
        <td>
          <select name="interpolation" id="interpolation">
            <option value="linear">Linear</option>
            <option value="step">Step</option>
            <option value="step-before">Step-before</option>
            <option value="step-after">Step-after</option>
            <option value="basis">Basis</option>
            <option value="bundle">Bundle</option>
            <option value="cardinal">Cardinal</option>
            <option value="monotone" selected>Monotone</option>
          </select>
        </td>
        <td style="padding-left:10px;">
          <button id="redrawAll">Redraw All</button>
        </td>
        <td style="padding-left:12px; font-size:12px;">
          <label>
            <input type="checkbox" id="bundleToggle" />
            LOD バンドリング
          </label>
        </td>
      </tr>
    </table>
  </div>

  <div id="canvases"></div>

  <script type="text/javascript">
    var osqpModule = null;
    var osqpModulePromise = null;

    var options = {
      svg: { height: 700, width: 3000, topPadding: 55 },
      animation: { transitionDuration: 700 },
      characters: {
        interpolation: "monotone",
        class: "line",
        labelClass: "name",
        labelX: 4,
        labelDy: -4,
        sessionCoefficient: 2,
        strokeWidth: 4,
        highlightStrokeWidth: 8,
        highlightDuration: 300,
        nonHighlightedOpacity: 0.2,
        toKeep: null
      },
      locations: {
        interpolation: "monotone",
        fontSize: "26px",
        labelX: 30,
        labelDy: -10,
        padding: 18,
        opacity: 0.2,
        class: "locationPath",
        labelClass: "locationLabel",
        splitLength: 400,
        hierarchy: {
          enabled: true,
          opacity: 0.28,
          padding: 16,
          paddingStep: 10
        }
      },
      algorithm: {
        sweepingMaxIterations: 20,
        stableNeeded: 2,              // 不足⑤で使ってるなら統一
        missingEntityPolicy: "hold",  // "hold" | "bottom"
        missingEntityPenalty: 100000,  // "bottom" のときの大きい値

        // ---- 5.3 / 5.4 ----
        alpha: 0.1,          // 5.3 session sim の α
        din: 36,             // 5.4 (5c) 同一セッション内の隣接距離
        dout: 72,            // 5.4 (5d) 異セッション間の最小距離
        epsOrder: 1e-3,      // 5.4 (5a) orderの厳密性

        lambdaWhite: 0.05,   // 目的関数：whitespace項の重み
        // ADMM solver settings
        rho: 2.0,
        sigma: 1e-6,         // (Q + rho A^T A + sigma I) を正則化
        maxIterQP: 4000,
        epsAbs: 1e-6,
        epsRel: 1e-6,
        useOSQP: true
      },
      bundle: {
        enabled: false,
        lineWidth: 6,
        opacity: 0.6
      }
    };

    $(document).ready(function () {
      $("#dataset").selectmenu({
        width: 230,
        select: function () {
          renderAllDatasets();
        }
      });

      $("#interpolation").selectmenu({
        width: 200,
        select: function (event, ui) {
          options.characters.interpolation = ui.item.value;
          options.locations.interpolation = options.characters.interpolation;
          renderAllDatasets();
        }
      });

      $("#redrawAll").button().on("click", function () {
        renderAllDatasets();
      });

      $("#bundleToggle").on("change", function () {
        options.bundle.enabled = $(this).is(":checked");
        renderAllDatasets();
      });

      if (options.algorithm.useOSQP) {
        ensureOSQPReady(renderAllDatasets);
      } else {
        renderAllDatasets();
      }
    });

    function ensureOSQPReady(cb) {
      if (osqpModule) {
        cb();
        return;
      }
      if (typeof OSQPModule !== "function") {
        cb();
        return;
      }
      if (!osqpModulePromise) {
        osqpModulePromise = OSQPModule()
          .then(function (mod) {
            osqpModule = mod;
            return mod;
          })
          .catch(function (err) {
            console.error("OSQPModule init failed:", err);
            return null;
          });
      }
      osqpModulePromise.then(function () { cb(); });
    }

    function getDatasetListFromSelect() {
      var list = [];
      $("#dataset option").each(function () {
        list.push({ path: $(this).attr("value"), name: $(this).text() });
      });
      return list;
    }


    function renderAllFromResults(results) {
      d3.select("#canvases").html("");
      results.forEach(function (res, idx) {
        var panel = d3.select("#canvases")
          .append("div")
          .attr("class", "panel")
          .attr("id", "panel-" + idx);

        panel.append("h3").text(res.info.name);
        var meta = panel.append("div").attr("class", "meta");

        if (res.error) {
          meta.text("path: " + res.info.path);
          panel.append("div")
            .style("color", "crimson")
            .style("padding", "8px 0 12px 0")
            .text("Failed to load: " + res.info.path);
          return;
        }

        var svg = panel.append("svg")
          .attr("height", options.svg.height)
          .attr("width", options.svg.width);

        var metrics = res.data && res.data.d3 ? res.data.d3.metrics : null;
        var metaText = "path: " + res.info.path +
          " / interpolation: " + options.characters.interpolation;
        if (metrics) {
          metaText += " / crossings: " + metrics.crossingsTotal +
            " (avg " + metrics.crossingsAvg.toFixed(2) + ")";
        }
        meta.text(metaText);
        drawStoryFlow(res.data, res.options, svg, "p" + idx + "-");
      });
    }

    function renderAllDatasets() {
      if (options.algorithm.useOSQP && !osqpModule && typeof OSQPModule === "function") {
        ensureOSQPReady(renderAllDatasets);
        return;
      }

      var datasets = getDatasetListFromSelect();
      var results = new Array(datasets.length);
      var remaining = datasets.length;

      if (remaining === 0) {
        d3.select("#canvases").html("");
        return;
      }

      datasets.forEach(function (dsInfo, idx) {
        d3.json(dsInfo.path, function (error, json) {
          if (error) {
            console.error(error);
            results[idx] = { info: dsInfo, error: true };
          } else {
            console.log("LOADED:", dsInfo.path, "keys=", Object.keys(json));
            console.log("HAS locationTree?", !!json.locationTree, json.locationTree);

            var local = jQuery.extend(true, {}, json);
            var localOptions = jQuery.extend(true, {}, options);
            localOptions.characters.toKeep = null;

            if (localOptions.bundle && localOptions.bundle.enabled) {
              localOptions.algorithm.din = 0;
            }

            var annotated = annotateDataset(local, localOptions);
            results[idx] = { info: dsInfo, data: annotated, options: localOptions, error: false };
          }

          remaining--;
          if (remaining === 0) renderAllFromResults(results);
        });
      });
    }

    function drawStoryFlow(dataset, options, svg, idPrefix) {
      idPrefix = idPrefix || "";
      var characterColors = dataset.characters.length <= 10 ? d3.scale.category10() : d3.scale.category20();
      var locationColors = dataset.locations.length <= 10 ? d3.scale.category10() : d3.scale.category20();

      for (var i = 0; i < dataset.characters.length; ++i) {
        dataset.characters[i].d3 = { color: characterColors(i) };
      }

      for (i = 0; i < dataset.locations.length; ++i) {
        dataset.locations[i].d3 = { color: locationColors(i) };
      }

      var maxCharacters = dataset.d3.time
        .map(function (time) { return (time.sortedCharacters ? time.sortedCharacters.length : 0); })
        .reduce(function (x, y) { return Math.max(x, y); }, 0); // ← 初期値 0

      if (!dataset.d3 || !dataset.d3.time || dataset.d3.time.length === 0) {
        svg.append("text")
          .attr("x", 20).attr("y", 40)
          .style("font-size", "18px")
          .text("No frames to draw (dataset.d3.time is empty)");
        return;
      }

      var axisPadding = 32;
      var axisY = options.svg.height - 16;
      var plotHeight = axisY - options.svg.topPadding;

      var verticalScale = d3.scale.linear()
        .domain([0, maxCharacters])
        .range([options.svg.topPadding, options.svg.height - axisPadding]);

      var horizontalScale = d3.scale.linear()
        .domain([0, dataset.d3.time.length])
        .range([0, options.svg.width]);

      var timeTicks = d3.range(0, dataset.d3.time.length + 1);
      var timeAxis = d3.svg.axis()
        .scale(horizontalScale)
        .orient("bottom")
        .tickValues(timeTicks)
        .tickFormat(function (d) {
          return dataset.d3.timeStart + d;
        });

      var timeGrid = d3.svg.axis()
        .scale(horizontalScale)
        .orient("bottom")
        .tickValues(timeTicks)
        .tickSize(-plotHeight, 0)
        .tickFormat("");

      svg.selectAll(".timeAxis").remove();
      svg.selectAll(".timeGrid").remove();
      svg.append("g")
        .attr("class", "axis timeGrid")
        .attr("transform", "translate(0," + axisY + ")")
        .call(timeGrid);
      svg.append("g")
        .attr("class", "axis timeAxis")
        .attr("transform", "translate(0," + axisY + ")")
        .call(timeAxis);

      // =========================
      // QP y -> screen y transform
      // =========================
      var hasAnyQP = dataset.d3.time.some(function (tm) { return tm.d3 && tm.d3.y; });

      var yA = 1.0, yB = 0.0; // y_screen = yA*y_qp + yB

      if (hasAnyQP) {
        var minY = Infinity, maxY = -Infinity;

        for (var t0 = 0; t0 < dataset.d3.time.length; t0++) {
          var tm = dataset.d3.time[t0];
          if (!tm.d3 || !tm.d3.y) continue;

          // このフレームに出てる人物だけで min/max（描画と一致）
          for (var k0 = 0; k0 < tm.sortedCharacters.length; k0++) {
            var cid0 = tm.sortedCharacters[k0];
            var y0 = tm.d3.y[cid0];
            if (y0 == null || !isFinite(y0)) continue;
            if (y0 < minY) minY = y0;
            if (y0 > maxY) maxY = y0;
          }
        }

        if (isFinite(minY) && isFinite(maxY)) {
          var top = options.svg.topPadding;
          var bottom = options.svg.height - 10;
          var avail = bottom - top;
          var span = Math.max(1e-9, maxY - minY);

          // まずは距離感維持（a=1）で、上に持ち上げる
          yA = 1.0;

          // そのままだと下にはみ出すなら縮小
          if (span * yA > avail) {
            yA = avail / span;
          }

          // minY を top に合わせて平行移動
          yB = top - yA * minY;
        }
      }

      dataset.characters.forEach(function (c) { if (c.d3) c.d3.points = []; });
      dataset.locations.forEach(function (l) { if (l.d3) l.d3.points = []; });

      for (var t = 0; t < dataset.d3.time.length; ++t) {
        var time = dataset.d3.time[t];

        // QP y があるならそれを使う
        var hasQP = (time.d3 && time.d3.y);

        // fallback: old behavior needs characterGroups/offset
        if (!hasQP) {
          var characterGroups = time.locations
            .map(function (x) {
              return x.sessions.map(function (sId) {
                return dataset.sessions[sId].members.length;
              });
            })
            .reduce(function (x, y) { return x.concat(y); }, []);

          var offset = 0;

          characterGroups.forEach(function (charactersInSession) {
            var mean = 0;
            for (i = 0; i < charactersInSession; ++i) mean += verticalScale(offset + i);
            mean /= charactersInSession;

            for (i = 0; i < charactersInSession; ++i) {
              var cid = time.sortedCharacters[offset + i];
              var character = dataset.characters.filter(function (character) {
                return character.id == cid;
              })[0];

              if (character.isRemoved) continue;
              if (!character.d3) character.d3 = { color: characterColors(character.id) };
              if (character.d3.points === undefined) character.d3.points = [];

              character.d3.points.push({
                x: horizontalScale(t),
                y: mean + ((verticalScale(offset + i) - mean) / options.characters.sessionCoefficient)
              });
            }

            offset += charactersInSession;
          });

        } else {
          // QP layout
          for (var k = 0; k < time.sortedCharacters.length; k++) {
            var cid2 = time.sortedCharacters[k];
            var character2 = dataset.characters.filter(function (character) {
              return character.id == cid2;
            })[0];

            if (!character2 || character2.isRemoved) continue;
            if (!character2.d3) character2.d3 = { color: characterColors(character2.id) };
            if (!character2.d3.points) character2.d3.points = [];

            character2.d3.points.push({
              x: horizontalScale(t),
              y: yA * time.d3.y[cid2] + yB  // ★これが最終y（QP結果）
            });
          }

        }
      }

      for (t = 0; t < dataset.d3.time.length; ++t) {
        time = dataset.d3.time[t];

        for (i = 0; i < time.locations.length; ++i) {
          var sessions = time.locations[i].sessions;

          for (var k = 0; k < sessions.length; ++k) {
            var session = dataset.sessions[sessions[k]];
            var location = dataset.locations[session.location];

            for (var h = 0; h < session.members.length; ++h) {
              var character2 = dataset.characters.filter(function (character) {
                return character.id == session.members[h];
              })[0];

              if (location.d3.points == undefined) location.d3.points = [];

              character2.d3.points.forEach(function (characterPoint) {
                if (characterPoint.x != horizontalScale(t)) return;

                if (location.d3.points.length == 0) {
                  location.d3.points.push({ top: characterPoint, bottom: characterPoint });
                } else {
                  var lastPoint = location.d3.points[location.d3.points.length - 1];

                  if (lastPoint.top.x == characterPoint.x) {
                    if (lastPoint.top.y > characterPoint.y) {
                      location.d3.points[location.d3.points.length - 1].top = characterPoint;
                    } else if (lastPoint.bottom.y < characterPoint.y) {
                      location.d3.points[location.d3.points.length - 1].bottom = characterPoint;
                    }
                  } else {
                    location.d3.points.push({ top: characterPoint, bottom: characterPoint });
                  }
                }
              });
            }
          }
        }
      }

      dataset.locations = dataset.locations.filter(function (location) {
        return location.d3.points != undefined;
      });

      for (i = 0; i < dataset.locations.length; ++i) {
        var loc = dataset.locations[i];
        if (loc.baseId === undefined || loc.baseId === null) loc.baseId = loc.id;

        for (k = 1; k < loc.d3.points.length; ++k) {
          if (loc.d3.points[k].top.x - loc.d3.points[k - 1].top.x > options.locations.splitLength) {
            var newLocation = jQuery.extend(true, {}, loc);
            newLocation.d3.points = newLocation.d3.points.slice(k);
            newLocation.id = dataset.locations.length;
            newLocation.baseId = loc.baseId;
            loc.d3.points = loc.d3.points.slice(0, k);
            dataset.locations.push(newLocation);
            break;
          }
        }
      }

      dataset.d3.charactersHighlighted = 0;

      function toggleCharacterHighlight(character) {
        if (dataset.d3.charactersHighlighted == 0)
          svg.selectAll("." + options.characters.class)
            .transition()
            .duration(options.characters.highlightDuration)
            .style('opacity', options.characters.nonHighlightedOpacity)
            .style('stroke-width', options.characters.strokeWidth);

        character.d3.isHighlighted = !character.d3.isHighlighted;
        dataset.d3.charactersHighlighted += character.d3.isHighlighted ? 1 : -1;

        if (dataset.d3.charactersHighlighted == 0)
          svg.selectAll("." + options.characters.class)
            .transition()
            .duration(options.characters.highlightDuration)
            .style('opacity', 1.0)
            .style('stroke-width', options.characters.strokeWidth);
      }

      svg.on("click", function () {
        dataset.characters.forEach(function (character) {
          if (!character.isRemoved && character.d3 && character.d3.isHighlighted) {
            toggleCharacterHighlight(character);
          }
        });
      });

      dataset.characters.forEach(function (character) {
        if (character.isRemoved) character.d3.points = [];
      });

      var locationArea = d3.svg.area().interpolate(options.locations.interpolation)
        .x(function (d) { return d.top.x; })
        .y0(function (d) { return d.bottom.y + options.locations.padding; })
        .y1(function (d) { return d.top.y - options.locations.padding; });

      // ---- Hierarchical background bands (locGroup) ----
      if (options.locations.hierarchy && options.locations.hierarchy.enabled && dataset.d3 && dataset.d3.time) {
        function makeNodeKey(node, parentKey) {
          var self = (typeof node.id === "number") ? ("id:" + node.id) : ("name:" + (node.name || node.type || "node"));
          return parentKey ? (parentKey + "/" + self) : self;
        }

        function buildHierarchyBands(ds) {
          var bandState = {};
          var timeStart = (ds.d3 && typeof ds.d3.timeStart === "number") ? ds.d3.timeStart : 0;

          function getState(key, depth, topKey, nodeType) {
            if (!bandState[key]) {
              bandState[key] = { key: key, depth: depth, topKey: topKey, nodeType: nodeType, segments: [], current: null };
            }
            return bandState[key];
          }

          function collectBounds(node, parentKey, depth, topKey, bounds, moment) {
            if (!node) return { min: Infinity, max: -Infinity, count: 0 };

            var key = makeNodeKey(node, parentKey);
            var nextTopKey = topKey;
            if (node.type === "root") {
              nextTopKey = null;
            } else if (!topKey) {
              nextTopKey = key;
            }

            var minY = Infinity, maxY = -Infinity, cnt = 0;

            if (node.type === "entity") {
              var y = moment.d3.y[node.id];
              if (y != null && isFinite(y)) {
                var ys = yA * y + yB;
                minY = Math.min(minY, ys);
                maxY = Math.max(maxY, ys);
                cnt++;
              }
            }

            var children = node.children || [];
            for (var i = 0; i < children.length; i++) {
              var res = collectBounds(children[i], key, depth + 1, nextTopKey, bounds, moment);
              if (res.count > 0) {
                minY = Math.min(minY, res.min);
                maxY = Math.max(maxY, res.max);
                cnt += res.count;
              }
            }

            if (node.type === "location" && cnt > 0) {
              bounds[key] = { min: minY, max: maxY, depth: depth, topKey: nextTopKey, nodeType: node.type };
            }

            return { min: minY, max: maxY, count: cnt };
          }

          for (var t = 0; t < ds.d3.time.length; t++) {
            var moment = ds.d3.time[t];
            if (!moment || !moment.relationshipRoot || !moment.d3 || !moment.d3.y) {
              continue;
            }

            var bounds = {};
            collectBounds(moment.relationshipRoot, "", -1, null, bounds, moment);

            var seen = {};
            for (var key in bounds) {
              if (!bounds.hasOwnProperty(key)) continue;
              var b = bounds[key];
              var st = getState(key, b.depth, b.topKey, b.nodeType);
              var pad = options.locations.hierarchy.padding +
                options.locations.hierarchy.paddingStep * Math.max(0, b.depth);

              if (!st.current) {
                st.current = { key: key + "-" + st.segments.length, baseKey: key, depth: st.depth, topKey: st.topKey, points: [] };
                st.segments.push(st.current);
              }

              st.current.points.push({
                x: horizontalScale(t),
                top: b.min - pad,
                bottom: b.max + pad
              });
              seen[key] = true;
            }

            for (var k in bandState) {
              if (!bandState.hasOwnProperty(k)) continue;
              if (!seen[k] && bandState[k].current) {
                bandState[k].current = null;
              }
            }
          }

          var palette = [
            "#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd",
            "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf",
            "#393b79", "#637939", "#8c6d31", "#843c39", "#7b4173",
            "#3182bd", "#e6550d", "#31a354", "#756bb1", "#636363"
          ];
          function bandColor(key) {
            var idx = 0;
            for (var i = 0; i < key.length; i++) idx = (idx * 31 + key.charCodeAt(i)) % palette.length;
            return palette[idx];
          }
          var out = [];
          for (var k2 in bandState) {
            if (!bandState.hasOwnProperty(k2)) continue;
            var segs = bandState[k2].segments;
            for (var s = 0; s < segs.length; s++) {
              if (!segs[s].points || segs[s].points.length < 2) continue;
              segs[s].isTop = false;
            var base = bandColor(segs[s].baseKey);
              var hsl = d3.hsl(base);
            hsl.l = Math.min(0.65, hsl.l);
            hsl.s = Math.max(0.65, hsl.s);
              segs[s].color = hsl.toString();
              out.push(segs[s]);
            }
          }

          return out;
        }

        var hierarchyArea = d3.svg.area().interpolate(options.locations.interpolation)
          .x(function (d) { return d.x; })
          .y0(function (d) { return d.bottom; })
          .y1(function (d) { return d.top; });

        var hierarchyBands = buildHierarchyBands(dataset);
        var hSel = svg.selectAll(".hierarchyBand").data(hierarchyBands, function (d) { return d.key; });

    // annotateDataset はあなたの貼ったまま（省略せず残してOK）
    function annotateDataset(dataset, options) {

        dataset.sessions.map(function (s) { return [typeof s.start, typeof s.end, s.start, s.end].join(" "); }).slice(0, 5)
      );

      // time=0 と time=1 で active が何個になるか

        for (var i = 0; i < dataset.sessions.length; i++) {

        var s = dataset.sessions[i];

        if (!(s.start < s.end)) bad.push(["start>=end", i, s.start, s.end]);
        if (typeof s.location !== "number") bad.push(["non-number location", i, s.location]);

      // -----------------------------
      // Relationship Tree utilities  (5.1)
      // -----------------------------

      function deepClone(obj) {

      // locationTree の各ノードに parent を付け、id→node の辞書を作る
      function indexLocationTree(root) {
        var byId = {};

        function dfs(node, parent) {
          // id が数値（location id）であれば登録
          if (node.id !== undefined && node.id !== null && node.id !== "root") {
            byId[node.id] = node;
          }
          if (!node.children) node.children = [];
          node.children.forEach(function (ch) { dfs(ch, node); });

      // tree のうち「アクティブな location だけ」残しつつ、空 branch を刈る
      function pruneInactiveLocations(root, activeLocationIdSet) {
        function recur(node) {

          node.children.forEach(function (ch) {
            // 子を先に処理
            var keptChild = recur(ch);

            // location ノード（id を持つ想定）
            var isLocation = (ch.id !== undefined && ch.id !== null && ch.id !== "root");
            var isActive = isLocation ? !!activeLocationIdSet[ch.id] : true; // root は常に true

            // ルール：
            // - location ノードなら active のものだけ残す
            // - ただし active でなくても active な子孫がいるなら残す（中間ノード用）
            if (isLocation) {

          return node;

      // relationship tree を作る：
      // root/locationTree をコピー → active location だけ残す → 各location に session/entity をぶら下げる
      function buildRelationshipTreeAtTime(dataset, time) {
        if (!dataset.locationTree) {
          throw new Error("dataset.locationTree is missing. Please add it at the top level of the JSON.");
        }

        // 1) locationTree を複製して index 化
        var root = deepClone(dataset.locationTree);
        var locNodeById = indexLocationTree(root);

        // 2) この時刻にアクティブな session を集め、active location を求める
        var activeLocation = {}; // id -> true
        var sessionsByLoc = {};  // locId -> [sessionIndex...]

        for (var i = 0; i < dataset.sessions.length; ++i) {
          var s = dataset.sessions[i];
          if (s.start <= time && time < s.end) {
            activeLocation[s.location] = true;
            if (!sessionsByLoc[s.location]) sessionsByLoc[s.location] = [];
            sessionsByLoc[s.location].push(i);
          }
        }

        // 3) アクティブでない location を tree から刈る
        root = pruneInactiveLocations(root, activeLocation);

        // 4) 各 location ノードに session ノードを追加し、その下に entity ノードを追加
        // ※ entity ノードは {type:"entity", id:<charId>} を入れる（order/weight は ordering で使う）
        // ※ session ノードは {type:"session", sid:<sessionIndex>, members:[...]} を入れる
        function attachSessions(node) {

          var isLocation =

            (node.type !== "entity") &&
            (node.type !== "session");

            // location ノードだと明示
            node.type = "location";

            // 既に session を付けた後に再度 attach しない保険（念のため）
            // （buildRelationshipTreeAtTime で毎回cloneしてるなら本来不要だが安全）

            sList.forEach(function (sid) {

                type: "session",
                sid: sid,
                start: sess.start,
                end: sess.end,
                location: sess.location,

      // -----------------------------

      // -----------------------------

      function buildRefRank(referenceSortedCharacters) {

      function computeWeightsBottomUp(node, refRank, fallbackWeight, prevWeightByChar, options) {
        if (!node) return fallbackWeight;

        if (node.type === "entity") {
          // 参照にあればそれを使う
          if (refRank[node.id] !== undefined) {
            node.weight = refRank[node.id];
            return node.weight;

            return node.weight;

          var penalty = (options.algorithm && options.algorithm.missingEntityPenalty !== undefined)

        if (children.length === 0) {

        var cnt = 0;
        for (var i = 0; i < children.length; ++i) {

        node.weight = (cnt > 0) ? (sum / cnt) : fallbackWeight;

      // node の子のうち「動かしていいノード」だけを barycenter(=weight) で安定ソート
      function barycenterSortChildren(node) {
        if (!node || !node.children || node.children.length <= 1) return;

        // locationTree ノード(root/locGroup)は子の locTree 部分を固定しているので、ここでは触らない
        if (node.type === "root" || node.type === "locGroup") {

        if (node.type === "location") {

          var sessKids = [];
          var rest = [];

          node.children.forEach(function (ch) {

            return (a.sid || 0) - (b.sid || 0);

            var wa = (a.weight !== undefined) ? a.weight : 1e18;
            var wb = (b.weight !== undefined) ? b.weight : 1e18;
            if (wa !== wb) return wa - wb;
            return (a.id || 0) - (b.id || 0);

      // relationship tree を下から上へ走査し、各レベルで barycenter ソート（論文 Fig.5 の “level-by-level”）

        node.children.forEach(barycenterSortBottomUp);

      // -----------------------------

      function sortNonLocationNodesBottomUp(node) {

            var wb = (b.weight !== undefined) ? b.weight : 1e18;

      function rebuildMomentLocationsFromTree(moment) {

      // -----------------------------

      // -----------------------------

      function minLocRankInSubtree(node, locRank, fallback) {

        if (node.type === "location" && node.id !== undefined && node.id !== null) {

      }

      function alignSessionsWeightedLCS(seqL, seqR, alpha) {
        // Paper Eq.(4) + DP recurrence (weighted LCS)
        var m = seqL.length, n = seqR.length;
        var dp = new Array(m + 1);
        var dir = new Array(m + 1); // 0 diag, 1 up, 2 left
        for (var i = 0; i <= m; i++) {
          dp[i] = new Array(n + 1).fill(0);
          dir[i] = new Array(n + 1).fill(0);
        }

        for (var i2 = 1; i2 <= m; i2++) {
          for (var j2 = 1; j2 <= n; j2++) {
            var sim = sessionSim(i2, j2, m, n, seqL[i2 - 1], seqR[j2 - 1], alpha);

            var vDiag = dp[i2 - 1][j2 - 1] + sim;
            var vUp = dp[i2 - 1][j2];
            var vLeft = dp[i2][j2 - 1];

            var best = vUp;
            var d = 1;

            if (vLeft > best) { best = vLeft; d = 2; }
            if (vDiag > best) { best = vDiag; d = 0; }

            // tie-break (important for stability):
            // prefer diag (more alignment), then up, then left
            if (vDiag === best) d = 0;
            else if (vUp === best) d = 1;
            else d = 2;

            dp[i2][j2] = best;
            dir[i2][j2] = d;
          }
        }

        // traceback to get matched session pairs in order
        var pairs = [];
        var i3 = m, j3 = n;
        while (i3 > 0 && j3 > 0) {
          var d2 = dir[i3][j3];
          if (d2 === 0) {
            // matched (i3-1, j3-1)
            pairs.push({ i: i3 - 1, j: j3 - 1, score: dp[i3][j3] - dp[i3 - 1][j3 - 1] });
            i3--; j3--;
          } else if (d2 === 1) {
            i3--;
          } else {
            j3--;
          }
        }
        pairs.reverse();
        return { score: dp[m][n], pairs: pairs };
      }

      function computeAlignmentForAllFrames(ds, options) {
        var alpha = (options.algorithm && typeof options.algorithm.alpha === "number")
          ? options.algorithm.alpha
          : 0.1; // paper default

        for (var t = 0; t < ds.d3.time.length - 1; t++) {
          var L = ds.d3.time[t];
          var R = ds.d3.time[t + 1];
          if (!L || !R) continue;

          var SL = buildSessionSequence(L);
          var SR = buildSessionSequence(R);

          var res = alignSessionsWeightedLCS(SL, SR, alpha);

          var sessionPairs = [];
          var alignedSegments = [];

          for (var p = 0; p < res.pairs.length; p++) {
            var pr = res.pairs[p];
            var sL = SL[pr.i];
            var sR = SR[pr.j];

            // line alignment inside matched session pair:
            // aligned entity segments = LCS elements between ordered member lists
            var alignedEntities = lcsMatchedElements(sL.membersOrdered, sR.membersOrdered);

            sessionPairs.push({
              sidL: sL.sid,
              sidR: sR.sid,
              score: sessionSim(pr.i + 1, pr.j + 1, SL.length, SR.length, sL, sR, alpha),
              alignedEntities: alignedEntities
            });

            // produce ↔ constraints candidates (Si,t ↔ Si,t+1) for aligned entities
            for (var k = 0; k < alignedEntities.length; k++) {
              alignedSegments.push({
                cid: alignedEntities[k],
                t0: t,
                t1: t + 1,
                sidL: sL.sid,
                sidR: sR.sid
              });
            }
          }

          if (!L.d3) L.d3 = {};
          L.d3.alignment = {
            alpha: alpha,
            dpScore: res.score,
            sessionPairs: sessionPairs,
            alignedSegments: alignedSegments
          };
        }
      }

      // After sweeping, compute alignment on the bestDataset (not the transient dataset)
      computeAlignmentForAllFrames(bestDataset, options);

      // ============================================================
      // 5.4 Compaction (QP) via ADMM: minimize wiggle + whitespace
      // s.t. (5a) order, (5b) alignment eq, (5c) din eq, (5d) dout ineq
      // Output: bestDataset.d3.time[t].d3.y[cid] (absolute y)
      // ============================================================

      // ---- sparse builder (CSC-like but we use dense ops eventually) ----
      function makeVarIndexer(nChars, nTimes) {
        return {
          nChars: nChars,
          nTimes: nTimes,
          nVar: nChars * nTimes,
          idx: function (cid, t) { return cid * nTimes + t; }
        };
      }

      function zeros(n) { return new Float64Array(n); }

      function dotRowAx(rowCols, rowVals, x) {
        var s = 0;
        for (var k = 0; k < rowCols.length; k++) s += rowVals[k] * x[rowCols[k]];
        return s;
      }

      // Build session blocks at time t: each block is ordered member list (top->bottom)
      function getSessionBlocksAtTime(ds, moment) {
        var blocks = [];
        if (!moment || !moment.locations) return blocks;

        // 1) multi-member session blocks (>=2)
        var inAnyBlock = {}; // cid -> true

        for (var li = 0; li < moment.locations.length; li++) {
          var loc = moment.locations[li];
          if (!loc || !loc.sessions) continue;

          for (var si = 0; si < loc.sessions.length; si++) {
            var sid = loc.sessions[si];
            var sess = ds.sessions[sid];
            if (!sess || !sess.members) continue;

            // build ordered members by current vertical order
            var mem = {};
            for (var k = 0; k < sess.members.length; k++) mem[sess.members[k]] = true;

            var ordered = [];
            for (var p = 0; p < moment.sortedCharacters.length; p++) {
              var cid = moment.sortedCharacters[p];
              if (mem[cid]) ordered.push(cid);
            }

            if (ordered.length >= 2) {
              blocks.push({ sid: sid, members: ordered });
              for (var z = 0; z < ordered.length; z++) inAnyBlock[ordered[z]] = true;
            }
          }
        }

        // 2) singleton blocks for isolated characters (not in any >=2 session)
        // This is crucial to keep dout constraints alive and avoid collapse.
        if (moment.sortedCharacters) {
          for (var i = 0; i < moment.sortedCharacters.length; i++) {
            var cid2 = moment.sortedCharacters[i];
            if (!inAnyBlock[cid2]) {
              blocks.push({ sid: -1, members: [cid2] }); // sid=-1 means "isolated"
            }
          }
        }

        return blocks;
      }

      // Build objective: 0.5 x^T Q x + q^T x
      // wiggle: sum (y(i,t+1)-y(i,t))^2
      // white : lambda * sum_{session-boundary} ((y_lo - y_up) - dout)^2
      function buildObjective(ds, varIx, lambdaWhite, dout, wiggleWeight) {
        var n = varIx.nVar;

        // dense symmetric Q
        var Q = new Array(n);
        for (var i = 0; i < n; i++) Q[i] = new Float64Array(n);

        // linear term q
        var q = new Float64Array(n);

        function addQuadDiff(a, b, w) {
          // contributes w*(xa-xb)^2 to objective
          // objective is 0.5 x^T Q x + q^T x
          Q[a][a] += 2 * w;
          Q[b][b] += 2 * w;
          Q[a][b] += -2 * w;
          Q[b][a] += -2 * w;
        }

        function addBoundarySlackSquared(a, b, w, d) {
          // w*((xa-xb)-d)^2 = w*(xa-xb)^2 - 2*w*d*(xa-xb) + const
          // quadratic part:
          addQuadDiff(a, b, w);

          // linear part: -2*w*d*xa + 2*w*d*xb
          q[a] += -2 * w * d;
          q[b] += +2 * w * d;
        }

        var nChars = varIx.nChars, nTimes = varIx.nTimes;
        var wWiggle = (typeof wiggleWeight === "number") ? wiggleWeight : 1.0;

        // (1) wiggle
        for (var cid = 0; cid < nChars; cid++) {
          for (var t = 0; t < nTimes - 1; t++) {
            addQuadDiff(varIx.idx(cid, t), varIx.idx(cid, t + 1), wWiggle);
          }
        }

        // (2) white space: ONLY session boundaries (different blocks) at each time
        for (var t2 = 0; t2 < nTimes; t2++) {
          var moment = ds.d3.time[t2];
          if (!moment || !moment.sortedCharacters || moment.sortedCharacters.length < 2) continue;

          // build blocks and char->block
          var blocks = getSessionBlocksAtTime(ds, moment);
          var charToBlock = {};
          for (var bi = 0; bi < blocks.length; bi++) {
            var ms = blocks[bi].members;
            for (var ii = 0; ii < ms.length; ii++) charToBlock[ms[ii]] = bi;
          }

          var ord = moment.sortedCharacters;

          // boundary = adjacent pair in global order that belongs to different session blocks
          for (var k = 0; k < ord.length - 1; k++) {
            var up = ord[k], lo = ord[k + 1];
            var bu = charToBlock[up], bl = charToBlock[lo];
            if (bu === undefined || bl === undefined) continue;
            if (bu === bl) continue; // within-session spacing is handled by din equality constraints

            // add ((y_lo - y_up) - dout)^2
            addBoundarySlackSquared(
              varIx.idx(lo, t2),
              varIx.idx(up, t2),
              lambdaWhite,
              dout
            );
          }
        }

        return { Q: Q, q: q };
      }

      // Build linear constraints in row form:
      // each row is (cols[], vals[]), with bounds l,u
      function buildConstraintsRows(ds, varIx, din, dout, epsOrder) {
        var rows = [];
        var l = [];
        var u = [];
        var INF = 1e30;

        function addRow(cols, vals, lo, up) {
          rows.push({ cols: cols, vals: vals });
          l.push(lo);
          u.push(up);
        }

        var nTimes = varIx.nTimes;

        // (5a) order: y(lower,t) - y(upper,t) >= epsOrder
        for (var t = 0; t < nTimes; t++) {
          var order = ds.d3.time[t].sortedCharacters;
          if (!order || order.length < 2) continue;
          for (var k = 0; k < order.length - 1; k++) {
            var upper = order[k], lower = order[k + 1];
            addRow(
              [varIx.idx(lower, t), varIx.idx(upper, t)],
              [1, -1],
              epsOrder,
              INF
            );
          }
        }

      // (5b) alignment: y(cid,t+1) - y(cid,t) = 0
      for (var t2 = 0; t2 < nTimes - 1; t2++) {
        var al = ds.d3.time[t2].d3 && ds.d3.time[t2].d3.alignment;
        if (!al || !al.alignedSegments) continue;
          var segs = al.alignedSegments;
          for (var s = 0; s < segs.length; s++) {
            var cid = segs[s].cid;
            addRow(
              [varIx.idx(cid, t2 + 1), varIx.idx(cid, t2)],
              [1, -1],
              0,
              0
            );
          }
        }

        // (5c) din in-session: y(next,t) - y(prev,t) = din
        // (5d) dout between sessions: y(lower,t)-y(upper,t) >= dout on boundaries
        for (var t3 = 0; t3 < nTimes; t3++) {
          var moment = ds.d3.time[t3];
          if (!moment) continue;

          var blocks = getSessionBlocksAtTime(ds, moment);

          // din within each block
          for (var b = 0; b < blocks.length; b++) {
            var mems = blocks[b].members;
            for (var kk = 0; kk < mems.length - 1; kk++) {
              var a = mems[kk], b2 = mems[kk + 1];
              addRow(
                [varIx.idx(b2, t3), varIx.idx(a, t3)],
                [1, -1],
                din,
                din
              );
            }
          }

          // dout at boundaries: detect neighbors in global order belonging to different blocks
          var charToBlock = {};
          for (var bi = 0; bi < blocks.length; bi++) {
            var ms = blocks[bi].members;
            for (var ii = 0; ii < ms.length; ii++) charToBlock[ms[ii]] = bi;
          }

          var ord = moment.sortedCharacters;
          if (!ord) continue;

          for (var k3 = 0; k3 < ord.length - 1; k3++) {
            var up = ord[k3], lo = ord[k3 + 1];
            var bu = charToBlock[up], bl = charToBlock[lo];
            if (bu === undefined || bl === undefined) continue;
            if (bu === bl) continue; // already din
            addRow(
              [varIx.idx(lo, t3), varIx.idx(up, t3)],
              [1, -1],
              dout,
              INF
            );
          }
        }

        return { rows: rows, l: new Float64Array(l), u: new Float64Array(u) };
      }

      // Feasible initialization:
      // build y by scanning global order at each time using din/dout; then average across time, then enforce alignment by copy.
      function buildInitialFeasible(ds, varIx, din, dout, epsOrder) {
        var nVar = varIx.nVar;
        var x = new Float64Array(nVar);
        var nTimes = varIx.nTimes;

        for (var t = 0; t < nTimes; t++) {
          var moment = ds.d3.time[t];
          var ord = moment.sortedCharacters || [];
          if (ord.length === 0) continue;

          // boundary gaps decided by whether adjacent are in same session block or not
          var blocks = getSessionBlocksAtTime(ds, moment);
          var charToBlock = {};
          for (var bi = 0; bi < blocks.length; bi++) {
            var ms = blocks[bi].members;
            for (var ii = 0; ii < ms.length; ii++) charToBlock[ms[ii]] = bi;
          }

          var y = 0;
          x[varIx.idx(ord[0], t)] = y;

          for (var k = 0; k < ord.length - 1; k++) {
            var a = ord[k], b = ord[k + 1];
            var ba = charToBlock[a], bb = charToBlock[b];

            var step = din;
            if (ba === undefined || bb === undefined) step = din; // isolated lines treated like inside
            else if (ba !== bb) step = Math.max(dout, epsOrder);  // ensure order too

            y += step;
            x[varIx.idx(b, t)] = y;
          }
        }

        // enforce alignment equalities in init: for each aligned segment, copy y forward
        for (var t2 = 0; t2 < nTimes - 1; t2++) {
          var al = ds.d3.time[t2].d3 && ds.d3.time[t2].d3.alignment;
          if (!al || !al.alignedSegments) continue;
          var segs = al.alignedSegments;
          for (var s = 0; s < segs.length; s++) {
            var cid = segs[s].cid;
            x[varIx.idx(cid, t2 + 1)] = x[varIx.idx(cid, t2)];
          }
        }

        return x;
      }

      // ADMM solver for convex QP:
      // minimize 0.5 x^T Q x  s.t. l <= A x <= u
      // We implement:
      // x^{k+1} = argmin 0.5 x^T Q x + (rho/2)||A x - z + y||^2
      // z^{k+1} = proj_{[l,u]}(A x^{k+1} + y^k)
      // y^{k+1} = y^k + A x^{k+1} - z^{k+1}
      function solveQP_ADMM(Q, q, cons, x0, rho, sigma, maxIter, epsAbs, epsRel) {
        var rows = cons.rows, l = cons.l, u = cons.u;
        var m = rows.length;
        var n = x0.length;

        // Build dense AtA and At vectors once (m,n small enough in your scale)
        // For speed, pre-store rows as arrays
        var z = new Float64Array(m);
        var y = new Float64Array(m);

        // helper: Ax
        function Ax(x, out) {
          for (var i = 0; i < m; i++) {
            out[i] = dotRowAx(rows[i].cols, rows[i].vals, x);
          }
        }

        // Build matrix M = Q + rho A^T A + sigma I (dense), then factor each time with Cholesky-like (we'll do LDLT)
        // Compute AtA (dense)
        var AtA = new Array(n);
        for (var i = 0; i < n; i++) AtA[i] = new Float64Array(n);

        for (var r = 0; r < m; r++) {
          var cols = rows[r].cols, vals = rows[r].vals;
          for (var a = 0; a < cols.length; a++) {
            var ia = cols[a], va = vals[a];
            for (var b = 0; b < cols.length; b++) {
              var ib = cols[b], vb = vals[b];
              AtA[ia][ib] += va * vb;
            }
          }
        }

        var M = new Array(n);
        for (var i2 = 0; i2 < n; i2++) {
          M[i2] = new Float64Array(n);
          for (var j2 = 0; j2 < n; j2++) {
            M[i2][j2] = Q[i2][j2] + rho * AtA[i2][j2];
          }
          M[i2][i2] += sigma;
        }

        function solveLinear(M, b) {
          // Gaussian elimination with partial pivot (dense)
          // Copy to avoid destroying M
          var A = new Array(n);
          for (var i = 0; i < n; i++) {
            A[i] = new Float64Array(n);
            A[i].set(M[i]);
          }
          var x = new Float64Array(b);
          // Forward elim
          for (var k = 0; k < n; k++) {
            // pivot
            var piv = k;
            var best = Math.abs(A[k][k]);
            for (var i = k + 1; i < n; i++) {
              var v = Math.abs(A[i][k]);
              if (v > best) { best = v; piv = i; }
            }
            if (piv !== k) {
              var tmp = A[k]; A[k] = A[piv]; A[piv] = tmp;
              var t2 = x[k]; x[k] = x[piv]; x[piv] = t2;
            }
            var akk = A[k][k];
            if (Math.abs(akk) < 1e-12) akk = (akk >= 0 ? 1e-12 : -1e-12);

            for (var i = k + 1; i < n; i++) {
              var f = A[i][k] / akk;
              if (f === 0) continue;
              for (var j = k; j < n; j++) A[i][j] -= f * A[k][j];
              x[i] -= f * x[k];
            }
          }
          // Back-sub
          for (var i = n - 1; i >= 0; i--) {
            var s = x[i];
            for (var j = i + 1; j < n; j++) s -= A[i][j] * x[j];
            var aii = A[i][i];
            if (Math.abs(aii) < 1e-12) aii = (aii >= 0 ? 1e-12 : -1e-12);
            x[i] = s / aii;
          }
          return x;
        }

        var x = new Float64Array(x0);
        var ax = new Float64Array(m);
        Ax(x, ax);

        // init z = proj(Ax)
        for (var i3 = 0; i3 < m; i3++) {
          var v = ax[i3];
          if (v < l[i3]) v = l[i3];
          if (v > u[i3]) v = u[i3];
          z[i3] = v;
          y[i3] = 0;
        }

        var rhs = new Float64Array(n);
        var tmpAx = new Float64Array(m);

        for (var it = 0; it < maxIter; it++) {
          // rhs = rho A^T (z - y) - q
          rhs.fill(0);
          for (var r2 = 0; r2 < m; r2++) {
            var w = rho * (z[r2] - y[r2]);
            var cols2 = rows[r2].cols, vals2 = rows[r2].vals;
            for (var kk2 = 0; kk2 < cols2.length; kk2++) {
              rhs[cols2[kk2]] += vals2[kk2] * w;
            }
          }
          // subtract linear term
          if (q) {
            for (var iqq = 0; iqq < n; iqq++) rhs[iqq] -= q[iqq];
          }

          // Solve (Q + rho A^T A + sigma I) x = rhs
          x = solveLinear(M, rhs);

          // Ax
          Ax(x, tmpAx);

          // z = proj_{[l,u]}(Ax + y)
          var primalInf = 0;
          var dualInf = 0;
          for (var r3 = 0; r3 < m; r3++) {
            var v2 = tmpAx[r3] + y[r3];
            var zOld = z[r3];
            if (v2 < l[r3]) v2 = l[r3];
            if (v2 > u[r3]) v2 = u[r3];
            z[r3] = v2;

            var rPri = tmpAx[r3] - z[r3];
            primalInf = Math.max(primalInf, Math.abs(rPri));

            var rDual = rho * (z[r3] - zOld);
            dualInf = Math.max(dualInf, Math.abs(rDual));
          }

          // y update
          for (var r4 = 0; r4 < m; r4++) {
            y[r4] += (tmpAx[r4] - z[r4]);
          }

          // stopping
          var epsPri = epsAbs + epsRel * Math.max(normInf(tmpAx), normInf(z));
          var epsDual = epsAbs + epsRel * normInf(y);

          if (primalInf <= epsPri && dualInf <= epsDual) {
            // console.log("[QP] converged it=", it, "pri=", primalInf, "dual=", dualInf);
            break;
          }
        }

        return x;

        function normInf(v) {
          var mx = 0;
          for (var i = 0; i < v.length; i++) mx = Math.max(mx, Math.abs(v[i]));
          return mx;
        }
      }

      function solveQP_OSQP(Q, q, cons, rho, sigma, maxIter, epsAbs, epsRel) {
        if (!osqpModule) return null;

        var rows = cons.rows, l = cons.l, u = cons.u;
        var m = rows.length;
        var n = q.length;

        function denseToUpperCsc(mat, tol) {
          var p = new Int32Array(n + 1);
          var iList = [];
          var xList = [];
          var nnz = 0;

          for (var col = 0; col < n; col++) {
            p[col] = nnz;
            for (var row = 0; row <= col; row++) {
              var v = mat[row][col];
              if (Math.abs(v) > tol) {
                iList.push(row);
                xList.push(v);
                nnz++;
              }
            }
          }
          p[n] = nnz;
          return { p: p, i: new Int32Array(iList), x: new Float64Array(xList), nnz: nnz };
        }

        function rowsToCsc(rowsIn, nCols) {
          var counts = new Int32Array(nCols);
          for (var r = 0; r < rowsIn.length; r++) {
            var cols = rowsIn[r].cols;
            for (var k = 0; k < cols.length; k++) counts[cols[k]]++;
          }

          var p = new Int32Array(nCols + 1);
          var nnz2 = 0;
          for (var c = 0; c < nCols; c++) {
            p[c] = nnz2;
            nnz2 += counts[c];
          }
          p[nCols] = nnz2;

          var iArr = new Int32Array(nnz2);
          var xArr = new Float64Array(nnz2);
          var next = new Int32Array(p);

          for (var r2 = 0; r2 < rowsIn.length; r2++) {
            var cols2 = rowsIn[r2].cols;
            var vals2 = rowsIn[r2].vals;
            for (var k2 = 0; k2 < cols2.length; k2++) {
              var col = cols2[k2];
              var dest = next[col]++;
              iArr[dest] = r2;
              xArr[dest] = vals2[k2];
            }
          }

          return { p: p, i: iArr, x: xArr, nnz: nnz2 };
        }

        var P = denseToUpperCsc(Q, 1e-12);
        var A = rowsToCsc(rows, n);

        var solve = osqpModule.cwrap("osqp_solve_csc", "number",
          ["number", "number",
           "number", "number", "number", "number",
           "number", "number", "number", "number",
           "number", "number", "number",
           "number", "number", "number", "number", "number", "number"]);

        if (!osqpModule._malloc || !osqpModule._free || !osqpModule.setValue) {
          console.warn("OSQP module missing memory helpers");
          return null;
        }

        function mallocAndCopyInt(arr) {
          var ptr = osqpModule._malloc(arr.length * 4);
          for (var idx = 0; idx < arr.length; idx++) {
            osqpModule.setValue(ptr + idx * 4, arr[idx], "i32");
          }
          return ptr;
        }

        function mallocAndCopyDouble(arr) {
          var ptr = osqpModule._malloc(arr.length * 8);
          for (var idx2 = 0; idx2 < arr.length; idx2++) {
            osqpModule.setValue(ptr + idx2 * 8, arr[idx2], "double");
          }
          return ptr;
        }

        var P_p = mallocAndCopyInt(P.p);
        var P_i = mallocAndCopyInt(P.i);
        var P_x = mallocAndCopyDouble(P.x);
        var A_p = mallocAndCopyInt(A.p);
        var A_i = mallocAndCopyInt(A.i);
        var A_x = mallocAndCopyDouble(A.x);
        var qPtr = mallocAndCopyDouble(q);
        var lPtr = mallocAndCopyDouble(l);
        var uPtr = mallocAndCopyDouble(u);
        var xOut = osqpModule._malloc(n * 8);

        var status = solve(
          n, m,
          P.nnz, P_p, P_i, P_x,
          A.nnz, A_p, A_i, A_x,
          qPtr, lPtr, uPtr,
          epsAbs, epsRel, maxIter, rho, sigma,
          xOut
        );

        var x = new Float64Array(n);
        for (var xi = 0; xi < n; xi++) {
          x[xi] = osqpModule.getValue(xOut + xi * 8, "double");
        }

        osqpModule._free(P_p);
        osqpModule._free(P_i);
        osqpModule._free(P_x);
        osqpModule._free(A_p);
        osqpModule._free(A_i);
        osqpModule._free(A_x);
        osqpModule._free(qPtr);
        osqpModule._free(lPtr);
        osqpModule._free(uPtr);
        osqpModule._free(xOut);

        if (status !== 1 && status !== 2) {
          console.warn("OSQP status:", status, "(fallback to ADMM)");
          x = null;
        }

        return x;
      }

      function runCompactionQP(ds, options) {
        var nChars = ds.characters.length;
        var nTimes = ds.d3.time.length;
        var varIx = makeVarIndexer(nChars, nTimes);

        var din = options.algorithm.din;
        var dout = options.algorithm.dout;
        var epsOrder = options.algorithm.epsOrder || 1.0;
        var lambdaWhite = options.algorithm.lambdaWhite || 0.2;

        var rho = options.algorithm.rho || 2.0;
        var sigma = options.algorithm.sigma || 1e-6;
        var maxIter = options.algorithm.maxIterQP || 4000;
        var epsAbs = options.algorithm.epsAbs || 1e-6;
        var epsRel = options.algorithm.epsRel || 1e-6;

        var wiggleWeight = 1.0;
        var obj = buildObjective(ds, varIx, lambdaWhite, dout, wiggleWeight);
        var Q = obj.Q;
        var q = obj.q;

        var cons = buildConstraintsRows(ds, varIx, din, dout, epsOrder);

        var x0 = buildInitialFeasible(ds, varIx, din, dout, epsOrder);
        var x = null;

        if (options.algorithm.useOSQP && osqpModule) {
          x = solveQP_OSQP(Q, q, cons, rho, sigma, maxIter, epsAbs, epsRel);
        }
        if (!x) {
          x = solveQP_ADMM(Q, q, cons, x0, rho, sigma, maxIter, epsAbs, epsRel);
        }

        // store y back
        for (var t = 0; t < nTimes; t++) {
          var moment = ds.d3.time[t];
          if (!moment.d3) moment.d3 = {};
          moment.d3.y = new Array(nChars);
          for (var cid = 0; cid < nChars; cid++) {
            moment.d3.y[cid] = x[varIx.idx(cid, t)];
          }
        }
      }

      // ---- debug: alignment constraint volume ----
      (function () {
        var totalPairs = 0, totalSegs = 0;
        var maxSegs = 0, maxT = -1;

        for (var t = 0; t < bestDataset.d3.time.length - 1; t++) {
          var al = bestDataset.d3.time[t].d3 && bestDataset.d3.time[t].d3.alignment;
          if (!al) continue;

          var np = (al.sessionPairs ? al.sessionPairs.length : 0);
          var ns = (al.alignedSegments ? al.alignedSegments.length : 0);

          totalPairs += np;
          totalSegs += ns;

          if (ns > maxSegs) { maxSegs = ns; maxT = t; }

          console.log("[align] t=", t, "sessionPairs=", np, "alignedSegments=", ns, "dpScore=", al.dpScore);
        }

        console.log("[align] totalPairs=", totalPairs, "totalAlignedSegments=", totalSegs,
          "maxAlignedSegments=", maxSegs, "at t=", maxT);
      })();
      // ---- /debug ----

      function countCrossingsAll(ds) {
        var total = 0;
        for (var t = 0; t < ds.d3.time.length - 1; t++) {
          var a = ds.d3.time[t].sortedCharacters;
          var b = ds.d3.time[t + 1].sortedCharacters;
          var m = computeRealizationMatrix(a, b);
          total += computeCrossings(m, a, b);
        }
        return total;
      }

      function computeDatasetMetrics(ds) {
        var crossingsTotal = countCrossingsAll(ds);
        var crossingsAvg = 0;
        var crossingsSeries = [];

        for (var t = 0; t < ds.d3.time.length - 1; t++) {
          var a = ds.d3.time[t].sortedCharacters;
          var b = ds.d3.time[t + 1].sortedCharacters;
          if (!a || !b) continue;
          var m = computeRealizationMatrix(a, b);
          var c = computeCrossings(m, a, b);
          crossingsSeries.push(c);
        }

        if (ds.d3.time.length > 1) {
          crossingsAvg = crossingsTotal / (ds.d3.time.length - 1);
        }

        ds.d3.metrics = {
          crossingsTotal: crossingsTotal,
          crossingsAvg: crossingsAvg,
          series: {
            crossings: crossingsSeries
          }
        };
      }

      console.log("[cross] before QP =", countCrossingsAll(bestDataset));
      runCompactionQP(bestDataset, options);
      console.log("[cross] after  QP =", countCrossingsAll(bestDataset));

      computeDatasetMetrics(bestDataset);
      return bestDataset;
    }
  </script>
